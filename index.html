<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mythos Card Game</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Cinzel Einbindung -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    body { 
      background-color: #030712; 
      color: white; 
      font-family: 'Cinzel', serif; 
      user-select: none; 
    }
    .card-art-box {
      background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.6) 100%);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .mythic-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 25px rgba(14, 165, 233, 0.2);
    }
    .mythic-btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 50%, #075985 100%);
      border: 1px solid #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }
    .mythic-btn-menu {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.95) 100%);
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.1);
    }
    .crystal-btn {
      transition: all 0.2s ease-in-out;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .crystal-active {
      background: radial-gradient(circle at center, #0284c7 0%, #0369a1 100%);
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
      transform: scale(1.05);
    }

    /* Würfel Animation CSS */
    @keyframes rollDice {
      0% { transform: rotate(0deg) scale(0.5); opacity: 0; }
      50% { transform: rotate(720deg) scale(1.3); opacity: 1; }
      100% { transform: rotate(1080deg) scale(1); opacity: 1; }
    }
    .animate-dice-roll {
      animation: rollDice 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const BANNED_WORDS = [
      'arsch', 'idiot', 'scheisse', 'scheiße', 'wichser', 'hurensohn', 'spast', 'depp',
      'fick', 'fucker', 'fuck', 'bitch', 'asshole', 'bastard', 'nazi', 'hitler', 'cunt',
      'nigger', 'nigga', 'piss', 'penis', 'vagina', 'neger', 'wank', 'retard'
    ];

    const validatePlayerName = (input) => {
      const trimmed = input.trim();
      if (trimmed.length < 3) return { valid: false, error: 'Name muss mind. 3 Zeichen lang sein!' };
      if (trimmed.length > 16) return { valid: false, error: 'Name darf max. 16 Zeichen lang sein!' };
      
      const cleanRegex = /^[a-zA-Z0-9_äöüÄÖÜß\s]+$/;
      if (!cleanRegex.test(trimmed)) return { valid: false, error: 'Keine Sonderzeichen erlaubt!' };

      const lower = trimmed.toLowerCase().replace(/[\s_0-9]/g, '');
      const containsBanned = BANNED_WORDS.some(word => lower.includes(word));
      if (containsBanned) return { valid: false, error: 'Unangebrachter Name nicht erlaubt!' };

      return { valid: true, error: '' };
    };

    const CardArt = {
      wizard: (
        <svg viewBox="0 0 100 120" className="w-full h-full drop-shadow-md">
          <circle cx="50" cy="50" r="38" fill="#581c87" opacity="0.4" />
          <path d="M 30 110 L 50 45 L 70 110 Z" fill="#3b0764" stroke="#a855f7" strokeWidth="2" />
          <path d="M 40 55 Q 50 90 60 55 C 55 75 45 75 40 55 Z" fill="#e2e8f0" />
          <circle cx="50" cy="48" r="10" fill="#fde047" opacity="0.8" />
          <path d="M 25 45 L 50 10 L 75 45 Z" fill="#6b21a8" stroke="#f59e0b" strokeWidth="2" />
          <line x1="20" y1="100" x2="35" y2="40" stroke="#78350f" strokeWidth="3" strokeLinecap="round" />
          <circle cx="35" cy="40" r="5" fill="#38bdf8" />
        </svg>
      ),
      jester: (
        <svg viewBox="0 0 100 120" className="w-full h-full drop-shadow-md">
          <circle cx="50" cy="50" r="38" fill="#831843" opacity="0.4" />
          <path d="M 25 75 L 35 60 L 50 80 L 65 60 L 75 75 L 50 105 Z" fill="#be185d" stroke="#f472b6" strokeWidth="1.5" />
          <path d="M 30 48 Q 15 25 10 35 Q 25 50 35 45 Z" fill="#e11d48" stroke="#fecdd3" strokeWidth="1.5" />
          <path d="M 70 48 Q 85 25 90 35 Q 75 50 65 45 Z" fill="#0284c7" stroke="#bae6fd" strokeWidth="1.5" />
          <circle cx="10" cy="35" r="4" fill="#fef08a" />
          <circle cx="90" cy="35" r="4" fill="#fef08a" />
          <circle cx="50" cy="48" r="14" fill="#fde047" opacity="0.8" />
        </svg>
      ),
      bow: (
        <svg viewBox="0 0 100 120" className="w-full h-full drop-shadow-md">
          <path d="M 25 100 C 50 80 80 50 65 20" fill="none" stroke="#15803d" strokeWidth="6" strokeLinecap="round" />
          <line x1="20" y1="90" x2="75" y2="25" stroke="#78350f" strokeWidth="3" />
          <path d="M 75 25 L 65 28 L 72 35 Z" fill="#ef4444" />
        </svg>
      ),
      axe: (
        <svg viewBox="0 0 100 120" className="w-full h-full drop-shadow-md">
          <line x1="25" y1="95" x2="75" y2="25" stroke="#78350f" strokeWidth="7" strokeLinecap="round" />
          <path d="M 55 30 C 70 15 85 25 80 50 C 65 45 55 40 50 35 Z" fill="#94a3b8" stroke="#f8fafc" strokeWidth="2" />
        </svg>
      ),
      dagger: (
        <svg viewBox="0 0 100 120" className="w-full h-full drop-shadow-md">
          <line x1="30" y1="90" x2="70" y2="30" stroke="#38bdf8" strokeWidth="5" strokeLinecap="round" />
          <path d="M 70 30 L 85 15 L 75 35 L 55 55 Z" fill="#cbd5e1" stroke="#f8fafc" strokeWidth="1.5" />
        </svg>
      ),
      banner: (
        <svg viewBox="0 0 100 120" className="w-full h-full drop-shadow-md">
          <line x1="30" y1="15" x2="30" y2="105" stroke="#78350f" strokeWidth="6" strokeLinecap="round" />
          <path d="M 30 25 L 80 25 L 65 45 L 80 65 L 30 65 Z" fill="#f59e0b" stroke="#fef08a" strokeWidth="2" />
        </svg>
      )
    };

    const SUITS = {
      yellow: { name: 'Gelb', title: 'DIE STANDARTE', bg: 'from-amber-950 via-yellow-950 to-slate-950', border: 'border-amber-400', art: CardArt.banner },
      red: { name: 'Rot', title: 'DIE AXT', bg: 'from-red-950 via-rose-950 to-slate-950', border: 'border-red-500', art: CardArt.axe },
      green: { name: 'Grün', title: 'DER BOGEN', bg: 'from-emerald-950 via-green-950 to-slate-950', border: 'border-emerald-400', art: CardArt.bow },
      blue: { name: 'Blau', title: 'DER DOLCH', bg: 'from-blue-950 via-sky-950 to-slate-950', border: 'border-blue-400', art: CardArt.dagger }
    };

    const AI_NAMES = ['Merlin', 'Morgana', 'Gandalf', 'Circe', 'Albus'];

    function CardBack({ size = "md" }) {
      const dim = size === "sm" ? "w-12 h-20" : size === "lg" ? "w-28 h-40" : "w-20 h-32";
      return (
        <div className={`${dim} rounded-xl border-2 border-sky-400/60 overflow-hidden shadow-2xl relative bg-slate-950`}>
          <img src="./1791625015038.jpg" alt="Kartenrücken" className="w-full h-full object-cover" />
        </div>
      );
    }

    function CardFace({ card, size = "md", onClick, disabled }) {
      const dim = size === "sm" ? "w-12 h-20" : size === "lg" ? "w-28 h-40" : "w-20 h-32";
      if (!card) return null;

      const isWizard = card.type === 'wizard';
      const isJester = card.type === 'jester';
      const suitInfo = SUITS[card.suit] || {};

      const cornerText = isWizard ? 'Z' : isJester ? 'N' : card.value;
      const titleText = isWizard ? 'ZAUBERER' : isJester ? 'NARR' : suitInfo.title;

      const artComponent = isWizard ? CardArt.wizard : isJester ? CardArt.jester : suitInfo.art;

      const bgStyle = isWizard
        ? 'from-purple-950 via-indigo-950 to-slate-950 border-amber-300'
        : isJester
        ? 'from-slate-900 via-zinc-900 to-slate-950 border-slate-400'
        : `${suitInfo.bg} ${suitInfo.border}`;

      return (
        <div 
          onClick={!disabled ? onClick : undefined}
          className={`${dim} rounded-xl bg-gradient-to-b ${bgStyle} border-2 p-1 flex flex-col justify-between items-center relative shadow-2xl cursor-pointer active:scale-95 transition-transform overflow-hidden`}
        >
          <div className="w-full flex justify-between font-black text-amber-300 text-xs drop-shadow z-10">
            <span>{cornerText}</span>
            <span>{cornerText}</span>
          </div>

          <div className="card-art-box w-full flex-1 my-0.5 rounded-lg p-0.5 flex flex-col items-center justify-center relative overflow-hidden">
            <div className="w-full h-full flex items-center justify-center">
              {artComponent}
            </div>
            <span className="absolute bottom-0.5 text-[6px] font-bold text-amber-200 tracking-tighter uppercase drop-shadow bg-black/60 px-1 rounded">
              {titleText}
            </span>
          </div>

          <div className="w-full flex justify-between font-black text-amber-300 text-xs drop-shadow rotate-180 z-10">
            <span>{cornerText}</span>
            <span>{cornerText}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [screen, setScreen] = useState('menu');
      
      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem('wizard_profile');
        return saved ? JSON.parse(saved) : { name: 'Erzmagier', level: 1, xp: 0, gamesPlayed: 0, wins: 0 };
      });

      const [isEditingName, setIsEditingName] = useState(false);
      const [nameInput, setNameInput] = useState(profile.name);
      const [nameError, setNameError] = useState('');

      const handleSaveName = () => {
        const check = validatePlayerName(nameInput);
        if (!check.valid) {
          setNameError(check.error);
          return;
        }
        const updated = { ...profile, name: nameInput.trim() };
        setProfile(updated);
        localStorage.setItem('wizard_profile', JSON.stringify(updated));
        setIsEditingName(false);
        setNameError('');
      };

      const [playerCount, setPlayerCount] = useState(4);
      const [maxRounds, setMaxRounds] = useState(15);
      const [difficulty, setDifficulty] = useState('Normal');

      const [round, setRound] = useState(1);
      const [phase, setPhase] = useState('bidding');
      const [players, setPlayers] = useState([]);
      const [trumpCard, setTrumpCard] = useState(null);
      const [playedCards, setPlayedCards] = useState([]);
      const [turn, setTurn] = useState(0);

      // Neue States für Würfel-Animation & Rundenabrechnung
      const [rollingDice, setRollingDice] = useState(false);
      const [diceResult, setDiceResult] = useState(null);
      const [roundSummary, setRoundSummary] = useState(null);

      const startNewGame = () => {
        const initialPlayers = [
          { id: 0, name: profile.name, isHuman: true, bid: null, tricks: 0, score: 0, hand: [] }
        ];
        for (let i = 1; i < playerCount; i++) {
          initialPlayers.push({
            id: i,
            name: `${AI_NAMES[i-1]} (KI)`,
            isHuman: false,
            bid: null,
            tricks: 0,
            score: 0,
            hand: []
          });
        }
        setPlayers(initialPlayers);
        setScreen('game');

        // Runde 1 starten mit Würfel-Animation!
        triggerDiceStart(1, initialPlayers);
      };

      const triggerDiceStart = (rNum, currentPlayers) => {
        setRollingDice(true);
        setDiceResult(null);

        setTimeout(() => {
          // Erster Startspieler per Würfelwurf (0 bis playerCount - 1)
          const winningStarter = Math.floor(Math.random() * currentPlayers.length);
          setDiceResult(winningStarter);

          setTimeout(() => {
            setRollingDice(false);
            startRound(rNum, currentPlayers, winningStarter);
          }, 1500);
        }, 1200);
      };

      const startRound = (rNum, currentPlayers, startingPlayerIdx) => {
        setRound(rNum);
        setPhase('bidding');
        setPlayedCards([]);
        setTurn(startingPlayerIdx);

        let deck = [];
        const suits = ['yellow', 'red', 'green', 'blue'];
        suits.forEach(s => {
          for(let v = 1; v <= 13; v++) deck.push({ type: 'number', value: v, suit: s });
        });
        for(let i=0; i<4; i++) deck.push({ type: 'wizard' });
        for(let i=0; i<4; i++) deck.push({ type: 'jester' });

        deck = deck.sort(() => Math.random() - 0.5);

        const newPlayers = currentPlayers.map(p => {
          const hand = deck.splice(0, rNum);
          return { ...p, hand, bid: null, tricks: 0 };
        });

        const trump = deck.length > 0 ? deck[0] : null;

        newPlayers.forEach(p => {
          if (!p.isHuman) {
            let kiBid = 0;
            p.hand.forEach(c => {
              if (c.type === 'wizard' || (c.type === 'number' && c.value > 10)) kiBid++;
            });
            p.bid = Math.min(kiBid, rNum);
          }
        });

        setTrumpCard(trump);
        setPlayers(newPlayers);
      };

      const handleHumanBid = (bidVal) => {
        setPlayers(prev => prev.map(p => p.isHuman ? { ...p, bid: bidVal } : p));
        setPhase('playing');
      };

      const playCard = (playerIdx, cardIdx) => {
        const p = players[playerIdx];
        const card = p.hand[cardIdx];

        const newHand = p.hand.filter((_, i) => i !== cardIdx);
        const newPlayed = [...playedCards, { playerId: p.id, card }];

        setPlayedCards(newPlayed);
        setPlayers(prev => prev.map(pl => pl.id === p.id ? { ...pl, hand: newHand } : pl));

        if (newPlayed.length === players.length) {
          setTimeout(() => evaluateTrick(newPlayed), 1500);
        } else {
          setTurn((playerIdx + 1) % players.length);
        }
      };

      useEffect(() => {
        if (screen === 'game' && phase === 'playing' && turn !== 0 && playedCards.length < players.length && !rollingDice && !roundSummary) {
          const timer = setTimeout(() => {
            const ki = players[turn];
            if (ki && ki.hand.length > 0) {
              playCard(turn, 0);
            }
          }, 800);
          return () => clearTimeout(timer);
        }
      }, [screen, phase, turn, playedCards, rollingDice, roundSummary]);

      const evaluateTrick = (cardsOnTable) => {
        let winningCardObj = cardsOnTable[0];

        const firstWizard = cardsOnTable.find(c => c.card.type === 'wizard');
        if (firstWizard) {
          winningCardObj = firstWizard;
        } else {
          const leadCardObj = cardsOnTable.find(c => c.card.type === 'number');
          const leadSuit = leadCardObj ? leadCardObj.card.suit : null;
          const trumpSuit = (trumpCard && trumpCard.type === 'number') ? trumpCard.suit : null;

          let highestRank = -1;

          cardsOnTable.forEach(c => {
            const card = c.card;
            if (card.type === 'number') {
              let rank = 0;
              if (trumpSuit && card.suit === trumpSuit) {
                rank = 200 + card.value;
              } else if (leadSuit && card.suit === leadSuit) {
                rank = 100 + card.value;
              } else {
                rank = card.value;
              }

              if (rank > highestRank) {
                highestRank = rank;
                winningCardObj = c;
              }
            }
          });
        }

        const winnerId = winningCardObj.playerId;

        const updatedPlayers = players.map(p => p.id === winnerId ? { ...p, tricks: p.tricks + 1 } : p);
        setPlayers(updatedPlayers);
        setPlayedCards([]);

        const human = updatedPlayers[0];
        if (human.hand.length === 0) {
          // RUNDENENDE: Punkte berechnen & Besten Schätzer ermitteln
          setTimeout(() => handleRoundEnd(updatedPlayers), 500);
        } else {
          setTurn(winnerId);
        }
      };

      // Punkte-Berechnung und Ermittlung des besten Schätzers
      const handleRoundEnd = (currentPlayers) => {
        let bestGuessers = [];
        let minDiff = 999;

        const calculated = currentPlayers.map(p => {
          const diff = Math.abs(p.bid - p.tricks);
          let pointsGained = 0;

          if (diff === 0) {
            pointsGained = 20 + (p.tricks * 10);
          } else {
            pointsGained = -(diff * 10);
          }

          if (diff < minDiff) {
            minDiff = diff;
            bestGuessers = [p.id];
          } else if (diff === minDiff) {
            bestGuessers.push(p.id);
          }

          return {
            ...p,
            score: p.score + pointsGained,
            pointsGained
          };
        });

        // Bei Gleichstand entscheidet der Zufall unter den besten Schätzern
        const nextRoundStarter = bestGuessers[Math.floor(Math.random() * bestGuessers.length)];

        setRoundSummary({
          round,
          calculatedPlayers: calculated,
          nextStarterId: nextRoundStarter
        });
      };

      const proceedToNextRound = () => {
        if (!roundSummary) return;

        const updated = roundSummary.calculatedPlayers;
        const nextStarter = roundSummary.nextStarterId;
        const nextR = round + 1;

        setPlayers(updated);
        setRoundSummary(null);

        if (nextR <= maxRounds) {
          startRound(nextR, updated, nextStarter);
        } else {
          alert("Spiel beendet! Danke fürs Spielen.");
          const updatedProfile = { ...profile, gamesPlayed: profile.gamesPlayed + 1, xp: profile.xp + 50 };
          setProfile(updatedProfile);
          localStorage.setItem('wizard_profile', JSON.stringify(updatedProfile));
          setScreen('menu');
        }
      };

      // ---------------- 1. HAUPTMENÜ ----------------
      if (screen === 'menu') {
        return (
          <div className="flex flex-col landscape:flex-row h-full max-w-4xl mx-auto bg-slate-950 justify-between overflow-y-auto">
            <div className="w-full landscape:w-1/2 aspect-video landscape:aspect-auto landscape:h-full relative overflow-hidden border-b landscape:border-b-0 landscape:border-r border-sky-500/30 shadow-2xl shrink-0 flex items-center justify-center">
              <img src="./1791625015038.jpg" alt="Mythos Header" className="w-full h-full object-cover" />
            </div>

            <div className="p-5 flex-1 flex flex-col justify-center gap-3">
              <button
                onClick={() => setScreen('game_setup')}
                className="w-full py-4 rounded-2xl mythic-btn-primary text-white font-black text-lg active:scale-95 transition-transform flex items-center justify-center gap-2"
              >
                <span>⚔️</span> Spiel starten
              </button>

              <button
                onClick={() => setScreen('multiplayer')}
                className="w-full py-3.5 rounded-2xl mythic-btn-menu text-sky-200 font-bold text-base active:scale-95 transition-transform flex items-center justify-center gap-2"
              >
                <span>🌐</span> Online-Lobby
              </button>

              <div className="flex gap-2">
                <button
                  onClick={() => setScreen('profile')}
                  className="flex-1 py-3 rounded-2xl mythic-btn-menu text-sky-300 font-bold text-sm active:scale-95 transition-transform flex items-center justify-center gap-1"
                >
                  <span>👤</span> Profil & Stats
                </button>
                <button
                  onClick={() => setScreen('rules')}
                  className="flex-1 py-3 rounded-2xl mythic-btn-menu text-sky-300 font-bold text-sm active:scale-95 transition-transform flex items-center justify-center gap-1"
                >
                  <span>📜</span> Regeln
                </button>
              </div>

              <span className="text-[10px] text-center text-slate-600 block mt-2">Mythos Card Game v3.2 • Dice & Scores</span>
            </div>
          </div>
        );
      }

      // ---------------- 2. EINZELSPIEL EINSTELLUNGEN ----------------
      if (screen === 'game_setup') {
        return (
          <div className="flex flex-col landscape:flex-row h-full max-w-4xl mx-auto bg-slate-950 justify-between overflow-hidden">
            <div className="w-full h-24 landscape:h-full landscape:w-1/2 relative overflow-hidden border-b landscape:border-b-0 landscape:border-r border-sky-500/30 shadow-2xl shrink-0 flex items-center justify-center">
              <img src="./1791625015038.jpg" alt="Mythos Header" className="w-full h-full object-cover" />
            </div>

            <div className="p-4 flex-1 flex flex-col gap-3 overflow-y-auto">
              <div className="flex justify-between items-center mb-1">
                <h2 className="text-lg font-black text-sky-300 flex items-center gap-2"><span>⚔️</span> Einzelspiel</h2>
                <button onClick={() => setScreen('menu')} className="text-xs bg-slate-900 border border-slate-800 text-sky-300 px-3 py-1.5 rounded-lg font-bold">Zurück</button>
              </div>

              <div className="mythic-card p-3 rounded-2xl flex flex-col gap-3">
                <div>
                  <label className="text-[11px] font-bold text-sky-200 block mb-1">Gegner / Spieleranzahl:</label>
                  <div className="grid grid-cols-4 gap-2">
                    {[3, 4, 5, 6].map(num => (
                      <button
                        key={num}
                        onClick={() => setPlayerCount(num)}
                        className={`py-2 rounded-xl font-extrabold text-sm crystal-btn ${playerCount === num ? 'crystal-active text-white' : 'bg-slate-900 text-slate-400'}`}
                      >
                        {num}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-bold text-sky-200 block mb-1">Rundenanzahl:</label>
                  <div className="grid grid-cols-3 gap-2">
                    {[5, 10, 15].map(num => (
                      <button
                        key={num}
                        onClick={() => setMaxRounds(num)}
                        className={`py-2 rounded-xl font-bold text-xs crystal-btn ${maxRounds === num ? 'crystal-active text-white' : 'bg-slate-900 text-slate-400'}`}
                      >
                        {num} R.
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-bold text-sky-200 block mb-1">KI-Schwierigkeit:</label>
                  <div className="grid grid-cols-3 gap-2">
                    {['Leicht', 'Normal', 'Magisch'].map(diff => (
                      <button
                        key={diff}
                        onClick={() => setDifficulty(diff)}
                        className={`py-2 rounded-xl font-bold text-xs crystal-btn ${difficulty === diff ? 'crystal-active text-white' : 'bg-slate-900 text-slate-400'}`}
                      >
                        {diff}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <button
                onClick={startNewGame}
                className="w-full py-3.5 rounded-2xl mythic-btn-primary text-white font-black text-base active:scale-95 transition-transform shrink-0 shadow-2xl"
              >
                Duell beginnen ⚔️
              </button>
            </div>
          </div>
        );
      }

      // ---------------- 3. PROFIL & STATISTIKEN ----------------
      if (screen === 'profile') {
        return (
          <div className="flex flex-col h-full max-w-md mx-auto p-4 justify-between bg-slate-950 overflow-y-auto">
            <div className="flex justify-between items-center mb-2">
              <h2 className="text-xl font-black text-sky-300">Spielerprofil</h2>
              <button onClick={() => setScreen('menu')} className="text-xs bg-slate-900 border border-slate-800 text-sky-300 px-3 py-1.5 rounded-lg font-bold">Zurück</button>
            </div>

            <div className="mythic-card p-5 rounded-2xl flex flex-col gap-4 my-auto items-center text-center">
              <div className="w-20 h-20 rounded-full border-2 border-sky-400 bg-slate-900 flex items-center justify-center text-3xl shadow-xl">
                🧙‍♂️
              </div>

              <div className="w-full flex flex-col items-center">
                {!isEditingName ? (
                  <div className="flex items-center gap-2">
                    <h3 className="text-xl font-black text-sky-200">{profile.name}</h3>
                    <button 
                      onClick={() => { setIsEditingName(true); setNameInput(profile.name); setNameError(''); }}
                      className="text-xs text-sky-400 bg-slate-900 border border-sky-500/30 px-2 py-0.5 rounded-lg"
                    >
                      ✏️
                    </button>
                  </div>
                ) : (
                  <div className="w-full flex flex-col gap-2">
                    <input
                      type="text"
                      value={nameInput}
                      onChange={(e) => { setNameInput(e.target.value); setNameError(''); }}
                      placeholder="Dein Name..."
                      maxLength={16}
                      className="w-full bg-slate-900 border border-sky-400 text-sky-100 p-2 rounded-xl text-center font-bold text-sm focus:outline-none"
                    />
                    {nameError && <span className="text-[10px] text-red-400 font-bold">{nameError}</span>}
                    <div className="flex gap-2">
                      <button 
                        onClick={handleSaveName}
                        className="flex-1 py-1.5 mythic-btn-primary text-white text-xs font-bold rounded-lg"
                      >
                        Speichern
                      </button>
                      <button 
                        onClick={() => { setIsEditingName(false); setNameError(''); }}
                        className="flex-1 py-1.5 bg-slate-800 text-slate-300 text-xs font-bold rounded-lg"
                      >
                        Abbrechen
                      </button>
                    </div>
                  </div>
                )}
                <span className="text-xs font-bold text-amber-400 mt-1">Level {profile.level} • Novize</span>
              </div>

              <div className="w-full bg-slate-900 border border-slate-800 p-3 rounded-xl text-left space-y-2 text-xs">
                <div className="flex justify-between"><span className="text-slate-400">Gespielte Matches:</span><span className="font-bold text-sky-300">{profile.gamesPlayed}</span></div>
                <div className="flex justify-between"><span className="text-slate-400">Siege:</span><span className="font-bold text-emerald-400">{profile.wins}</span></div>
                <div className="flex justify-between"><span className="text-slate-400">Gesammelte XP:</span><span className="font-bold text-amber-400">{profile.xp} XP</span></div>
              </div>
            </div>

            <button onClick={() => setScreen('menu')} className="w-full py-3 mythic-btn-primary text-white font-bold rounded-xl">Zurück zum Menü</button>
          </div>
        );
      }

      // ---------------- 4. ONLINE-LOBBY ----------------
      if (screen === 'multiplayer') {
        return (
          <div className="flex flex-col h-full max-w-md mx-auto p-4 justify-between bg-slate-950 overflow-y-auto">
            <div className="flex justify-between items-center mb-2">
              <h2 className="text-xl font-black text-sky-300">Online-Lobby</h2>
              <button onClick={() => setScreen('menu')} className="text-xs bg-slate-900 border border-slate-800 text-sky-300 px-3 py-1.5 rounded-lg font-bold">Zurück</button>
            </div>

            <div className="mythic-card p-5 rounded-2xl text-center space-y-4 my-auto">
              <div className="text-4xl">🔮</div>
              <h3 className="font-bold text-sky-200">Multiplayer-Schnittstelle</h3>
              <p className="text-xs text-slate-400 leading-relaxed">Hier wirst du dich bald mit Freunden verbinden oder offene Räume suchen können!</p>
            </div>

            <button onClick={() => setScreen('menu')} className="w-full py-3 mythic-btn-primary text-white font-bold rounded-xl">Zurück zum Menü</button>
          </div>
        );
      }

      // ---------------- 5. REGELN ----------------
      if (screen === 'rules') {
        return (
          <div className="flex flex-col h-full max-w-md mx-auto p-4 justify-between bg-slate-950 overflow-y-auto">
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-bold text-sky-400">Spielregeln</h2>
              <button onClick={() => setScreen('menu')} className="text-xs bg-slate-800 text-sky-300 px-3 py-1.5 rounded-lg font-bold">Zurück</button>
            </div>
            <div className="space-y-3 text-xs text-slate-300 leading-relaxed">
              <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                <h3 className="font-bold text-sky-300 mb-1">1. Startspieler & Schätzer</h3>
                <p>In Runde 1 entscheidet ein magischer Würfelwurf, wer anfängt. Ab Runde 2 darf immer der beste Schätzer der Vorrunde den ersten Stich spielen!</p>
              </div>
              <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                <h3 className="font-bold text-sky-300 mb-1">2. Die Aufgedeckte Trumpffarbe</h3>
                <p>Die aufgedeckte Karte bestimmt die Trumpffarbe der Runde. Diese Farbe sticht alle anderen Farben aus.</p>
              </div>
              <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                <h3 className="font-bold text-sky-300 mb-1">3. Zauberer & Narren</h3>
                <p>Zauberer (Z) gewinnt immer. Narr (N) verliert immer.</p>
              </div>
            </div>
            <button onClick={() => setScreen('menu')} className="mt-4 w-full py-3 mythic-btn-primary text-white font-bold rounded-xl">Zurück zum Menü</button>
          </div>
        );
      }

      // ---------------- 6. SPIELFELD ----------------
      const humanPlayer = players[0] || {};

      return (
        <div className="flex flex-col h-full max-w-md mx-auto p-2 justify-between bg-slate-950 relative overflow-hidden">
          
          {/* WÜRFEL ANIMATION OVERLAY */}
          {rollingDice && (
            <div className="absolute inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 text-center">
              <div className="text-6xl my-4 animate-dice-roll">🎲</div>
              <h2 className="text-xl font-black text-sky-300 mb-1">Magischer Würfelwurf</h2>
              <p className="text-xs text-slate-400">Wer eröffnet das erste Duell?</p>
              {diceResult !== null && (
                <div className="mt-4 bg-sky-950 border border-sky-400 text-sky-200 px-4 py-2 rounded-xl font-bold text-sm animate-bounce">
                  ✨ {players[diceResult]?.name} eröffnet die 1. Runde!
                </div>
              )}
            </div>
          )}

          {/* RUNDENABRECHNUNG POPUP */}
          {roundSummary && (
            <div className="absolute inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-between p-4">
              <h2 className="text-xl font-black text-sky-300 mt-2">Ergebnis Runde {roundSummary.round}</h2>
              
              <div className="w-full space-y-2 my-auto">
                {roundSummary.calculatedPlayers.map(p => (
                  <div key={p.id} className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center text-xs">
                    <div>
                      <div className="font-bold text-sky-200">{p.name}</div>
                      <div className="text-[10px] text-slate-400">Stiche: {p.tricks} (Ansage: {p.bid})</div>
                    </div>
                    <div className="text-right">
                      <div className={`font-extrabold ${p.pointsGained >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                        {p.pointsGained >= 0 ? `+${p.pointsGained}` : p.pointsGained} Ptn
                      </div>
                      <div className="text-[10px] font-bold text-amber-300">Gesamt: {p.score}</div>
                    </div>
                  </div>
                ))}

                <div className="bg-sky-950/80 border border-sky-400/50 p-2.5 rounded-xl text-center text-xs text-sky-200 mt-3 font-bold">
                  👑 Bester Schätzer: {roundSummary.calculatedPlayers.find(p => p.id === roundSummary.nextStarterId)?.name} beginnt Runde {round + 1}!
                </div>
              </div>

              <button 
                onClick={proceedToNextRound} 
                className="w-full py-3.5 mythic-btn-primary text-white font-black text-sm rounded-2xl shadow-2xl active:scale-95 transition-transform mb-2"
              >
                Nächste Runde starten ⚔️
              </button>
            </div>
          )}

          {/* TOP BAR */}
          <div className="flex justify-between items-center mb-1 bg-slate-900/80 p-2 rounded-xl border border-slate-800">
            <span className="text-xs font-bold text-sky-400">Runde {round} / {maxRounds}</span>
            <button onClick={() => setScreen('menu')} className="text-[10px] bg-slate-800 text-sky-300 px-2 py-1 rounded font-bold">Menü</button>
          </div>

          {/* KI GEGNER MIT PUNKTESTAND */}
          <div className="grid grid-cols-3 gap-1">
            {players.filter(p => !p.isHuman).map(p => (
              <div key={p.id} className={`p-1.5 rounded-lg border text-center text-xs ${turn === p.id ? 'border-sky-400 bg-slate-800' : 'border-slate-800 bg-slate-900/60'}`}>
                <div className="font-bold text-sky-300 truncate">{p.name}</div>
                <div className="text-[10px] font-bold text-amber-400">{p.score} Ptn</div>
                <div className="text-[9px] text-slate-300">Ansage: {p.bid !== null ? p.bid : '?'} | Stiche: {p.tricks}</div>
              </div>
            ))}
          </div>

          {/* MITTE / SPIELFELD */}
          <div className="flex-1 my-2 rounded-2xl bg-slate-900/50 border border-slate-800 p-2 flex flex-col justify-between items-center relative">
            <div className="flex items-center gap-2">
              <span className="text-[10px] font-bold text-sky-400 uppercase">Trumpf:</span>
              {trumpCard ? <CardFace card={trumpCard} size="sm" disabled /> : <CardBack size="sm" />}
            </div>

            <div className="grid grid-cols-2 gap-2 my-auto">
              {playedCards.map((pc, i) => (
                <div key={i} className="flex flex-col items-center">
                  <span className="text-[9px] text-sky-300 mb-0.5">{players[pc.playerId]?.name}</span>
                  <CardFace card={pc.card} size="sm" disabled />
                </div>
              ))}
            </div>

            {phase === 'bidding' && !rollingDice && (
              <div className="w-full bg-slate-900/95 border border-sky-500/50 p-3 rounded-2xl flex flex-col items-center gap-2 shadow-2xl backdrop-blur-md z-20">
                <span className="text-xs font-bold text-sky-300">Deine Stich-Ansage für Runde {round}:</span>
                <div className="flex gap-2 flex-wrap justify-center">
                  {Array.from({ length: round + 1 }, (_, i) => (
                    <button
                      key={i}
                      onClick={() => handleHumanBid(i)}
                      className="w-10 h-10 rounded-full bg-gradient-to-b from-sky-500 to-sky-700 text-white font-black text-base shadow-lg border border-sky-300 active:scale-90 transition-transform"
                    >
                      {i}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* SPIELER HAND & GESAMTPUNKTE */}
          <div className="bg-slate-900 p-2 rounded-2xl border border-slate-800 shadow-xl">
            <div className="flex justify-between items-center mb-1 px-1">
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-slate-300">Deine Hand:</span>
                <span className="text-xs font-extrabold text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded-md border border-amber-500/30">
                  {humanPlayer.score || 0} Ptn
                </span>
              </div>
              <span className="text-xs font-bold text-sky-400">
                Ansage: {humanPlayer.bid !== null ? humanPlayer.bid : '-'} | Stiche: {humanPlayer.tricks}
              </span>
            </div>

            <div className="flex gap-1.5 overflow-x-auto pb-1 justify-center">
              {humanPlayer.hand && humanPlayer.hand.map((card, i) => (
                <CardFace 
                  key={i} 
                  card={card} 
                  size="md" 
                  disabled={phase !== 'playing' || turn !== 0}
                  onClick={() => playCard(0, i)} 
                />
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
