<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mythos Card Game</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Cinzel Einbindung -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    body { 
      background-color: #030712; 
      color: white; 
      font-family: 'Cinzel', serif; 
      user-select: none; 
    }
    .card-art-box {
      background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.6) 100%);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .mythic-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 25px rgba(14, 165, 233, 0.2);
    }
    .mythic-btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 50%, #075985 100%);
      border: 1px solid #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }
    .mythic-btn-menu {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(30, 41, 59, 0.85) 100%);
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.1);
      backdrop-filter: blur(8px);
    }
    .crystal-btn {
      transition: all 0.2s ease-in-out;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .crystal-active {
      background: radial-gradient(circle at center, #0284c7 0%, #0369a1 100%);
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
      transform: scale(1.05);
    }

    /* Animations */
    @keyframes rollDiceAction {
      0% { transform: rotate(0deg) scale(0.6); }
      50% { transform: rotate(720deg) scale(1.3); }
      100% { transform: rotate(1080deg) scale(1); }
    }
    .animate-dice-active {
      animation: rollDiceAction 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes elementPodiumGlow {
      0%, 100% { box-shadow: 0 0 25px var(--glow-color), inset 0 0 15px var(--glow-color); }
      50% { box-shadow: 0 0 45px var(--glow-color), inset 0 0 25px var(--glow-color); }
    }
    .element-podium-active {
      animation: elementPodiumGlow 2s infinite ease-in-out;
    }

    /* Element-Muster für Podeste & Formen */
    .pattern-fire {
      background-image: repeating-linear-gradient(45deg, rgba(239, 68, 68, 0.3) 0, rgba(239, 68, 68, 0.3) 8px, transparent 8px, transparent 16px);
      clip-path: polygon(0% 10%, 10% 0%, 20% 8%, 30% 0%, 40% 8%, 50% 0%, 60% 8%, 70% 0%, 80% 8%, 90% 0%, 100% 10%, 100% 100%, 0% 100%);
    }
    .pattern-water {
      background-image: radial-gradient(circle, rgba(2, 132, 199, 0.35) 12%, transparent 12%);
      background-size: 14px 14px;
      border-radius: 2rem 2rem 1rem 1rem;
    }
    .pattern-diamond {
      background-image: linear-gradient(135deg, rgba(16, 185, 129, 0.3) 25%, transparent 25%), linear-gradient(225deg, rgba(16, 185, 129, 0.3) 25%, transparent 25%);
      background-size: 10px 10px;
      clip-path: polygon(15% 0%, 85% 0%, 100% 15%, 100% 100%, 0% 100%, 0% 15%);
    }
    .pattern-wind {
      background-image: repeating-linear-gradient(0deg, rgba(245, 158, 11, 0.25) 0, rgba(245, 158, 11, 0.25) 5px, transparent 5px, transparent 10px);
      border-radius: 1.5rem 1.5rem 2rem 2rem;
    }
    .pattern-arkan {
      background-image: radial-gradient(circle, rgba(168, 85, 247, 0.35) 20%, transparent 20%);
      background-size: 12px 12px;
      border-radius: 1rem 1rem 1.5rem 1.5rem;
    }

    /* Wuchtige TCG Impact-Slam Animation */
    @keyframes tcglikeSlam {
      0% { transform: translateY(180px) scale(1.7) rotate(-15deg); opacity: 0; filter: brightness(2.5) contrast(1.5); }
      35% { opacity: 1; transform: translateY(-16px) scale(1.2) rotate(4deg); }
      70% { transform: translateY(6px) scale(0.92) rotate(-2deg); }
      100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; filter: brightness(1); }
    }
    .animate-tcglike-slam {
      animation: tcglikeSlam 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      z-index: 30;
    }

    /* Epische TCG Element-Grafik-VFX */
    @keyframes elementVfxBurst {
      0% { transform: scale(0.3) rotate(0deg); opacity: 0; }
      40% { transform: scale(1.4) rotate(120deg); opacity: 1; filter: drop-shadow(0 0 35px currentColor); }
      100% { transform: scale(2.3) rotate(240deg); opacity: 0; }
    }
    .tcg-element-vfx {
      position: absolute;
      pointer-events: none;
      animation: elementVfxBurst 0.75s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      z-index: 40;
    }

    /* Animation: Karten schweben zum Gewinner des Stiches */
    @keyframes floatToWinnerTop {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-180px) scale(0.3); opacity: 0; filter: drop-shadow(0 0 20px #f59e0b); }
    }
    @keyframes floatToWinnerBottom {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(180px) scale(0.3); opacity: 0; filter: drop-shadow(0 0 20px #f59e0b); }
    }
    .animate-fly-to-top {
      animation: floatToWinnerTop 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .animate-fly-to-bottom {
      animation: floatToWinnerBottom 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const BANNED_WORDS = [
      'arsch', 'idiot', 'scheisse', 'scheiße', 'wichser', 'hurensohn', 'spast', 'depp',
      'fick', 'fucker', 'fuck', 'bitch', 'asshole', 'bastard', 'nazi', 'hitler', 'cunt',
      'nigger', 'nigga', 'piss', 'penis', 'vagina', 'neger', 'wank', 'retard'
    ];

    const validatePlayerName = (input) => {
      const trimmed = input.trim();
      if (trimmed.length < 3) return { valid: false, error: 'Name muss mind. 3 Zeichen lang sein!' };
      if (trimmed.length > 16) return { valid: false, error: 'Name darf max. 16 Zeichen lang sein!' };
      
      const cleanRegex = /^[a-zA-Z0-9_äöüÄÖÜß\s]+$/;
      if (!cleanRegex.test(trimmed)) return { valid: false, error: 'Keine Sonderzeichen erlaubt!' };

      const lower = trimmed.toLowerCase().replace(/[\s_0-9]/g, '');
      const containsBanned = BANNED_WORDS.some(word => lower.includes(word));
      if (containsBanned) return { valid: false, error: 'Unangebrachter Name nicht erlaubt!' };

      return { valid: true, error: '' };
    };

    const getCryptoRandomDice = () => {
      const array = new Uint32Array(1);
      window.crypto.getRandomValues(array);
      return (array[0] % 6) + 1;
    };

    const shuffleArray = (array) => {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    };

    const CardArt = {
      wizard: (
        <svg viewBox="0 0 100 120" className="w-full h-full drop-shadow-md">
          <circle cx="50" cy="50" r="38" fill="#581c87" opacity="0.4" />
          <path d="M 30 110 L 50 45 L 70 110 Z" fill="#3b0764" stroke="#a855f7" strokeWidth="2" />
          <path d="M 40 55 Q 50 90 60 55 C 55 75 45 75 40 55 Z" fill="#e2e8f0" />
          <circle cx="50" cy="48" r="10" fill="#fde047" opacity="0.8" />
          <path d="M 25 45 L 50 10 L 75 45 Z" fill="#6b21a8" stroke="#f59e0b" strokeWidth="2" />
          <line x1="20" y1="100" x2="35" y2="40" stroke="#78350f" strokeWidth="3" strokeLinecap="round" />
          <circle cx="35" cy="40" r="5" fill="#38bdf8" />
        </svg>
      ),
      jester: (
        <svg viewBox="0 0 100 120" className="w-full h-full drop-shadow-md">
          <circle cx="50" cy="50" r="38" fill="#831843" opacity="0.4" />
          <path d="M 25 75 L 35 60 L 50 80 L 65 60 L 75 75 L 50 105 Z" fill="#be185d" stroke="#f472b6" strokeWidth="1.5" />
          <path d="M 30 48 Q 15 25 10 35 Q 25 50 35 45 Z" fill="#e11d48" stroke="#fecdd3" strokeWidth="1.5" />
          <path d="M 70 48 Q 85 25 90 35 Q 75 50 65 45 Z" fill="#0284c7" stroke="#bae6fd" strokeWidth="1.5" />
          <circle cx="10" cy="35" r="4" fill="#fef08a" />
          <circle cx="90" cy="35" r="4" fill="#fef08a" />
          <circle cx="50" cy="48" r="14" fill="#fde047" opacity="0.8" />
        </svg>
      ),
      bow: (
        <svg viewBox="0 0 100 120" className="w-full h-full drop-shadow-md">
          <path d="M 25 100 C 50 80 80 50 65 20" fill="none" stroke="#15803d" strokeWidth="6" strokeLinecap="round" />
          <line x1="20" y1="90" x2="75" y2="25" stroke="#78350f" strokeWidth="3" />
          <path d="M 75 25 L 65 28 L 72 35 Z" fill="#ef4444" />
        </svg>
      ),
      axe: (
        <svg viewBox="0 0 100 120" className="w-full h-full drop-shadow-md">
          <line x1="25" y1="95" x2="75" y2="25" stroke="#78350f" strokeWidth="7" strokeLinecap="round" />
          <path d="M 55 30 C 70 15 85 25 80 50 C 65 45 55 40 50 35 Z" fill="#94a3b8" stroke="#f8fafc" strokeWidth="2" />
        </svg>
      ),
      dagger: (
        <svg viewBox="0 0 100 120" className="w-full h-full drop-shadow-md">
          <line x1="30" y1="90" x2="70" y2="30" stroke="#38bdf8" strokeWidth="5" strokeLinecap="round" />
          <path d="M 70 30 L 85 15 L 75 35 L 55 55 Z" fill="#cbd5e1" stroke="#f8fafc" strokeWidth="1.5" />
        </svg>
      ),
      banner: (
        <svg viewBox="0 0 100 120" className="w-full h-full drop-shadow-md">
          <line x1="30" y1="15" x2="30" y2="105" stroke="#78350f" strokeWidth="6" strokeLinecap="round" />
          <path d="M 30 25 L 80 25 L 65 45 L 80 65 L 30 65 Z" fill="#f59e0b" stroke="#fef08a" strokeWidth="2" />
        </svg>
      )
    };

    const SUITS = {
      yellow: { key: 'yellow', name: 'Gelb', title: 'WIND', bg: 'from-amber-950 via-yellow-950 to-slate-950', border: 'border-amber-400', art: CardArt.banner, primaryColor: '#f59e0b', glowColor: 'rgba(245, 158, 11, 0.6)', patternClass: 'pattern-wind', crownIcon: '⚡' },
      red: { key: 'red', name: 'Rot', title: 'FEUER', bg: 'from-red-950 via-rose-950 to-slate-950', border: 'border-red-500', art: CardArt.axe, primaryColor: '#ef4444', glowColor: 'rgba(239, 68, 68, 0.6)', patternClass: 'pattern-fire', crownIcon: '🔥' },
      green: { key: 'green', name: 'Grün', title: 'DIAMANTEN', bg: 'from-emerald-950 via-green-950 to-slate-950', border: 'border-emerald-400', art: CardArt.bow, primaryColor: '#10b981', glowColor: 'rgba(16, 185, 129, 0.6)', patternClass: 'pattern-diamond', crownIcon: '💎' },
      blue: { key: 'blue', name: 'Blau', title: 'WASSER', bg: 'from-blue-950 via-sky-950 to-slate-950', border: 'border-blue-400', art: CardArt.dagger, primaryColor: '#0284c7', glowColor: 'rgba(2, 132, 199, 0.6)', patternClass: 'pattern-water', crownIcon: '💧' },
      wizard: { key: 'wizard', name: 'Zauberer', title: 'ARKAN', bg: 'from-purple-950 via-indigo-950 to-slate-950', border: 'border-purple-400', art: CardArt.wizard, primaryColor: '#a855f7', glowColor: 'rgba(168, 85, 247, 0.6)', patternClass: 'pattern-arkan', crownIcon: '🔮' }
    };

    const renderTcgElementAnimation = (card) => {
      if (card.type === 'wizard') {
        return (
          <div className="tcg-element-vfx text-purple-400 flex items-center justify-center">
            <svg className="w-36 h-36" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="2.5">
              <circle cx="50" cy="50" r="44" strokeDasharray="6 4" className="animate-spin" style={{ animationDuration: '6s' }} />
              <polygon points="50,6 62,38 95,45 70,68 76,98 50,82 24,98 30,68 5,45 38,38" fill="#a855f7" fillOpacity="0.25" />
              <circle cx="50" cy="50" r="22" stroke="#fde047" strokeWidth="2" className="animate-ping" style={{ animationDuration: '1.5s' }} />
            </svg>
          </div>
        );
      }
      if (card.type === 'jester') {
        return (
          <div className="tcg-element-vfx text-pink-500 flex items-center justify-center">
            <svg className="w-36 h-36" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="3">
              <path d="M 15 50 Q 50 10 85 50 Q 50 90 15 50 Z" fill="#ec4899" fillOpacity="0.3" className="animate-spin" style={{ animationDuration: '4s' }} />
              <circle cx="50" cy="50" r="28" fill="#f43f5e" fillOpacity="0.4" className="animate-ping" />
            </svg>
          </div>
        );
      }
      if (card.suit === 'green') {
        return (
          <div className="tcg-element-vfx text-emerald-400 flex items-center justify-center">
            <svg className="w-36 h-36" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="3">
              <polygon points="50,8 75,32 65,85 35,85 25,32" fill="#34d399" fillOpacity="0.4" className="animate-pulse" />
              <line x1="50" y1="8" x2="50" y2="85" stroke="#a7f3d0" strokeWidth="2" />
              <line x1="25" y1="32" x2="75" y2="32" stroke="#a7f3d0" strokeWidth="2" />
              <circle cx="50" cy="50" r="40" stroke="#059669" strokeDasharray="8 8" className="animate-spin" style={{ animationDuration: '5s' }} />
            </svg>
          </div>
        );
      }
      if (card.suit === 'red') {
        return (
          <div className="tcg-element-vfx text-red-500 flex items-center justify-center">
            <svg className="w-36 h-36" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="3">
              <circle cx="50" cy="50" r="42" fill="#ef4444" fillOpacity="0.5" className="animate-ping" style={{ animationDuration: '1.2s' }} />
              <path d="M 50 2 Q 62 28 80 38 Q 98 50 80 68 Q 62 78 50 98 Q 38 78 20 68 Q 2 50 20 38 Q 38 28 50 2 Z" fill="#dc2626" fillOpacity="0.65" className="animate-pulse" />
              <circle cx="50" cy="50" r="25" fill="#f59e0b" fillOpacity="0.8" />
            </svg>
          </div>
        );
      }
      if (card.suit === 'blue') {
        return (
          <div className="tcg-element-vfx text-sky-400 flex items-center justify-center">
            <svg className="w-36 h-36" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="3">
              <circle cx="50" cy="50" r="44" stroke="#38bdf8" strokeWidth="4" className="animate-ping" style={{ animationDuration: '1.4s' }} />
              <ellipse cx="50" cy="50" rx="38" ry="22" fill="#0284c7" fillOpacity="0.5" className="animate-pulse" />
              <path d="M 15 50 Q 50 15 85 50 Q 50 85 15 50 Z" stroke="#bae6fd" strokeWidth="3.5" className="animate-spin" style={{ animationDuration: '3.5s' }} />
            </svg>
          </div>
        );
      }
      if (card.suit === 'yellow') {
        return (
          <div className="tcg-element-vfx text-amber-300 flex items-center justify-center">
            <svg className="w-36 h-36" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="3.5">
              <path d="M 15 30 Q 50 8 85 30 Q 50 52 15 70 Q 50 92 85 70" stroke="#f59e0b" strokeWidth="4" className="animate-spin" style={{ animationDuration: '2.5s' }} />
              <circle cx="50" cy="50" r="32" fill="#fde047" fillOpacity="0.35" className="animate-ping" style={{ animationDuration: '1.6s' }} />
            </svg>
          </div>
        );
      }
      return null;
    };

    const FAMOUS_WIZARDS = [
      'Merlin', 'Gandalf', 'Yennefer', 'Elminster', 'Zabini', 'Ged', 'Raistlin',
      'Howl', 'Dr. Strange', 'Zatanna', 'Bayonetta', 'Medivh', 'Khadgar', 'Tsukino',
      'Voldemort', 'Jaina', 'Jafar', 'Prospero', 'Veigar', 'Rincewind', 'Glinda',
      'Moiraine', 'Willow', 'Dumbledore', 'Saruman'
    ];

    const getXpNeededForGlobalLevel = (lvl) => {
      return 150 + (lvl - 1) * 50; 
    };

    const getXpNeededForElementLevel = (lvl) => {
      if (lvl <= 3) return 150;
      if (lvl <= 8) return 400;
      return 1000 + (lvl * 300);
    };

    function CardBack({ size = "md" }) {
      const dim = size === "sm" ? "w-12 h-20" : size === "lg" ? "w-28 h-40" : "w-20 h-32";
      return (
        <div className={`${dim} rounded-xl border-2 border-sky-400/60 overflow-hidden shadow-2xl relative bg-slate-950`}>
          <img src="./1791640361452.jpg" alt="Kartenrücken" className="w-full h-full object-cover" />
        </div>
      );
    }

    function CardFace({ card, size = "md", onClick, disabled, className = "" }) {
      const dim = size === "sm" ? "w-12 h-20" : size === "lg" ? "w-28 h-40" : "w-20 h-32";
      if (!card) return null;

      const isWizard = card.type === 'wizard';
      const isJester = card.type === 'jester';
      const suitInfo = SUITS[card.suit] || {};

      const cornerText = isWizard ? 'Z' : isJester ? 'N' : card.value;
      const titleText = isWizard ? 'ZAUBERER' : isJester ? 'NARR' : suitInfo.title;
      const artComponent = isWizard ? CardArt.wizard : isJester ? CardArt.jester : suitInfo.art;

      const bgStyle = isWizard
        ? 'from-purple-950 via-indigo-950 to-slate-950 border-amber-300'
        : isJester
        ? 'from-slate-900 via-zinc-900 to-slate-950 border-slate-400'
        : `${suitInfo.bg} ${suitInfo.border}`;

      return (
        <div 
          onClick={!disabled ? onClick : undefined}
          className={`${dim} rounded-xl bg-gradient-to-b ${bgStyle} border-2 p-1 flex flex-col justify-between items-center relative shadow-2xl cursor-pointer active:scale-95 transition-transform overflow-hidden ${className}`}
        >
          <div className="w-full flex justify-between font-black text-amber-300 text-xs drop-shadow z-10">
            <span>{cornerText}</span>
            <span>{cornerText}</span>
          </div>

          <div className="card-art-box w-full flex-1 my-0.5 rounded-lg p-0.5 flex flex-col items-center justify-center relative overflow-hidden">
            <div className="w-full h-full flex items-center justify-center">
              {artComponent}
            </div>
            <span className="absolute bottom-0.5 text-[6px] font-bold text-amber-200 tracking-tighter uppercase drop-shadow bg-black/60 px-1 rounded">
              {titleText}
            </span>
          </div>

          <div className="w-full flex justify-between font-black text-amber-300 text-xs drop-shadow rotate-180 z-10">
            <span>{cornerText}</span>
            <span>{cornerText}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [screen, setScreen] = useState('menu');
      const [showExitConfirm, setShowExitConfirm] = useState(false);
      const [showAvatarModal, setShowAvatarModal] = useState(false);
      
      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem('wizard_profile');
        const defaultProf = { 
          name: 'Erzmagier', 
          level: 1, 
          xp: 0, 
          activeSuit: 'red',
          selectedAvatar: { type: 'jester', suit: 'red', label: 'Narr (Rot)' },
          elementLevels: {
            red: { level: 1, xp: 0 },
            blue: { level: 1, xp: 0 },
            green: { level: 1, xp: 0 },
            yellow: { level: 1, xp: 0 }
          },
          offlinePlayed: 3,
          offlineWins: 0,
          onlinePlayed: 0,
          onlineWins: 0
        };
        if (!saved) return defaultProf;
        const parsed = JSON.parse(saved);
        return {
          ...defaultProf,
          ...parsed,
          level: parsed.level ?? 1,
          xp: parsed.xp ?? 0,
          elementLevels: parsed.elementLevels || defaultProf.elementLevels,
          selectedAvatar: parsed.selectedAvatar || defaultProf.selectedAvatar,
          activeSuit: parsed.activeSuit || defaultProf.activeSuit,
          offlinePlayed: parsed.offlinePlayed ?? 0,
          offlineWins: parsed.offlineWins ?? 0,
          onlinePlayed: parsed.onlinePlayed ?? 0,
          onlineWins: parsed.onlineWins ?? 0
        };
      });

      const [isEditingName, setIsEditingName] = useState(false);
      const [nameInput, setNameInput] = useState(profile.name);
      const [nameError, setNameError] = useState('');

      const handleSaveName = () => {
        const check = validatePlayerName(nameInput);
        if (!check.valid) {
          setNameError(check.error);
          return;
        }
        const updated = { ...profile, name: nameInput.trim() };
        setProfile(updated);
        localStorage.setItem('wizard_profile', JSON.stringify(updated));
        setIsEditingName(false);
        setNameError('');
      };

      const [playerCount, setPlayerCount] = useState(4);
      const [maxRounds, setMaxRounds] = useState(15);
      const [difficulty, setDifficulty] = useState('Normal');

      const [round, setRound] = useState(1);
      const [phase, setPhase] = useState('bidding');
      const [players, setPlayers] = useState([]);
      const [trumpCard, setTrumpCard] = useState(null);
      const [playedCards, setPlayedCards] = useState([]);
      const [turn, setTurn] = useState(0);

      const [animatingCardId, setAnimatingCardId] = useState(null);
      const [animatingCardObj, setAnimatingCardObj] = useState(null);
      const [collectingWinnerId, setCollectingWinnerId] = useState(null);

      const isEvaluatingRef = useRef(false);
      const isProcessingClickRef = useRef(false);
      const stateRef = useRef({});
      stateRef.current = { screen, phase, turn, players, playedCards, trumpCard, round, maxRounds, animatingCardId, collectingWinnerId };

      const [showDiceModal, setShowDiceModal] = useState(false);
      const [isDiceRolling, setIsDiceRolling] = useState(false);
      const [diceRolls, setDiceRolls] = useState(null);
      const [diceWinner, setDiceWinner] = useState(null);
      const [diceTimer, setDiceTimer] = useState(20);
      const [resultTimer, setResultTimer] = useState(10);

      const [biddingTimer, setBiddingTimer] = useState(20);
      const [turnTimer, setTurnTimer] = useState(20);

      const [roundSummary, setRoundSummary] = useState(null);
      const [summaryTimer, setSummaryTimer] = useState(10);

      const [victoryData, setVictoryData] = useState(null);
      const [victoryTimer, setVictoryTimer] = useState(20);

      useEffect(() => {
        let interval = null;
        if (showDiceModal && !diceRolls && !isDiceRolling) {
          interval = setInterval(() => {
            setDiceTimer(prev => { if (prev <= 1) { handleUserRollDice(); return 0; } return prev - 1; });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [showDiceModal, diceRolls, isDiceRolling]);

      useEffect(() => {
        let interval = null;
        if (showDiceModal && diceRolls && !isDiceRolling) {
          interval = setInterval(() => {
            setResultTimer(prev => { if (prev <= 1) { startRoundAfterDice(); return 0; } return prev - 1; });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [showDiceModal, diceRolls, isDiceRolling]);

      useEffect(() => {
        let interval = null;
        if (screen === 'game' && phase === 'bidding' && !showDiceModal && !roundSummary && !victoryData && !showExitConfirm) {
          interval = setInterval(() => {
            setBiddingTimer(prev => { if (prev <= 1) { handleHumanBid(0); return 20; } return prev - 1; });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [screen, phase, showDiceModal, roundSummary, victoryData, showExitConfirm]);

      useEffect(() => {
        let interval = null;
        if (screen === 'game' && phase === 'playing' && turn === 0 && !isEvaluatingRef.current && !animatingCardId && !collectingWinnerId && playedCards.length < players.length && !showDiceModal && !roundSummary && !victoryData && !showExitConfirm) {
          interval = setInterval(() => {
            setTurnTimer(prev => {
              if (prev <= 1) { if (players[0]?.hand?.length > 0) { playCard(0, 0); } return 20; }
              return prev - 1;
            });
          }, 1000);
        } else {
          setTurnTimer(20);
        }
        return () => clearInterval(interval);
      }, [screen, phase, turn, playedCards, animatingCardId, collectingWinnerId, players, showDiceModal, roundSummary, victoryData, showExitConfirm]);

      useEffect(() => {
        const interval = setInterval(() => {
          const { screen: s, phase: p, turn: t, players: pl, playedCards: pc, animatingCardId: anim, collectingWinnerId: coll } = stateRef.current;
          if (s === 'game' && p === 'playing' && t !== 0 && !isEvaluatingRef.current && !anim && !coll && !isProcessingClickRef.current && pc.length < pl.length && !showExitConfirm) {
            const currentKi = pl[t];
            if (currentKi && currentKi.hand.length > 0) { playCard(t, 0); }
          }
        }, 1200);
        return () => clearInterval(interval);
      }, [showExitConfirm]);

      useEffect(() => {
        let interval = null;
        if (roundSummary && !showExitConfirm) {
          interval = setInterval(() => {
            setSummaryTimer(prev => { if (prev <= 1) { proceedToNextRound(); return 0; } return prev - 1; });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [roundSummary, showExitConfirm]);

      useEffect(() => {
        let interval = null;
        if (victoryData && !showExitConfirm) {
          interval = setInterval(() => {
            setVictoryTimer(prev => { if (prev <= 1) { finishGameAndGoMenu(); return 0; } return prev - 1; });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [victoryData, showExitConfirm]);

      const startNewGame = () => {
        const shuffledNames = shuffleArray(FAMOUS_WIZARDS);
        const suitKeys = Object.keys(SUITS).filter(k => k !== 'wizard');

        const initialPlayers = [
          { 
            id: 0, 
            name: profile.name, 
            avatarObj: profile.selectedAvatar, 
            isHuman: true, 
            bid: null, 
            tricks: 0, 
            score: 0, 
            hand: [] 
          }
        ];

        for (let i = 1; i < playerCount; i++) {
          const randomSuit = suitKeys[Math.floor(Math.random() * suitKeys.length)];
          const avatarTypes = ['jester', 'number', 'wizard'];
          const chosenType = avatarTypes[Math.floor(Math.random() * avatarTypes.length)];
          
          let randomAvatarObj;
          if (chosenType === 'jester') {
            randomAvatarObj = { type: 'jester', suit: randomSuit, label: 'Narr' };
          } else if (chosenType === 'wizard') {
            randomAvatarObj = { type: 'wizard', suit: randomSuit, label: 'Zauberer' };
          } else {
            const randomVal = Math.floor(Math.random() * 13) + 1;
            randomAvatarObj = { type: 'number', value: randomVal, suit: randomSuit, label: `Karte ${randomVal}` };
          }

          initialPlayers.push({
            id: i,
            name: `${shuffledNames[i - 1]} (KI)`,
            avatarObj: randomAvatarObj,
            isHuman: false,
            bid: null,
            tricks: 0,
            score: 0,
            hand: []
          });
        }
        setPlayers(initialPlayers);
        setScreen('game');
        setShowExitConfirm(false);

        setShowDiceModal(true);
        setDiceRolls(null);
        setDiceWinner(null);
        setIsDiceRolling(false);
        setDiceTimer(20);
        setResultTimer(10);
      };

      const handleUserRollDice = () => {
        if (isDiceRolling || diceRolls) return;
        setIsDiceRolling(true);
        setTimeout(() => {
          const rolls = players.map(() => getCryptoRandomDice());
          let maxRoll = -1;
          let winnerIdx = 0;
          rolls.forEach((val, idx) => { if (val > maxRoll) { maxRoll = val; winnerIdx = idx; } });
          setDiceRolls(rolls);
          setDiceWinner(winnerIdx);
          setIsDiceRolling(false);
          setResultTimer(10);
        }, 800);
      };

      const handleDiceOverlayClick = (e) => {
        e.stopPropagation();
        if (!diceRolls && !isDiceRolling) { handleUserRollDice(); } 
        else if (diceRolls && !isDiceRolling) { startRoundAfterDice(); }
      };

      const startRoundAfterDice = () => {
        setShowDiceModal(false);
        startRound(1, players, diceWinner !== null ? diceWinner : 0);
      };

      const startRound = (rNum, currentPlayers, startingPlayerIdx) => {
        setRound(rNum);
        setPhase('bidding');
        setPlayedCards([]);
        setTurn(startingPlayerIdx);
        setAnimatingCardId(null);
        setAnimatingCardObj(null);
        setCollectingWinnerId(null);
        isEvaluatingRef.current = false;
        isProcessingClickRef.current = false;
        setBiddingTimer(20);
        setTurnTimer(20);

        let rawDeck = [];
        const suits = ['yellow', 'red', 'green', 'blue'];
        const roundSeed = Date.now();

        suits.forEach(s => {
          for(let v = 1; v <= 13; v++) {
            rawDeck.push({ type: 'number', value: v, suit: s, id: `${s}_${v}_${roundSeed}_${Math.random()}` });
          }
        });
        for(let i=0; i<4; i++) rawDeck.push({ type: 'wizard', id: `w_${i}_${roundSeed}_${Math.random()}` });
        for(let i=0; i<4; i++) rawDeck.push({ type: 'jester', id: `j_${i}_${roundSeed}_${Math.random()}` });

        let deck = shuffleArray(rawDeck);

        const newPlayers = currentPlayers.map(p => {
          const hand = deck.splice(0, rNum);
          return { ...p, hand, bid: null, tricks: 0 };
        });

        const trump = deck.length > 0 ? deck[0] : null;

        newPlayers.forEach(p => {
          if (!p.isHuman) {
            let kiBid = 0;
            p.hand.forEach(c => { if (c.type === 'wizard' || (c.type === 'number' && c.value > 10)) kiBid++; });
            p.bid = Math.min(kiBid, rNum);
          }
        });

        setTrumpCard(trump);
        setPlayers(newPlayers);
      };

      const handleHumanBid = (bidVal) => {
        setPlayers(prev => prev.map(p => p.isHuman ? { ...p, bid: bidVal } : p));
        setPhase('playing');
        setTurnTimer(20);
      };

      const playCard = (playerIdx, cardIdx) => {
        if (isEvaluatingRef.current || isProcessingClickRef.current || animatingCardId || collectingWinnerId) return;
        const currentPlayers = stateRef.current.players;
        const currentPlayed = stateRef.current.playedCards;
        const p = currentPlayers[playerIdx];
        if (!p || !p.hand[cardIdx]) return;

        const selectedCard = p.hand[cardIdx];
        const alreadyPlayed = currentPlayed.some(pc => pc.card.id && pc.card.id === selectedCard.id);
        if (alreadyPlayed) return;

        isProcessingClickRef.current = true;
        const newHand = p.hand.filter((_, i) => i !== cardIdx);
        
        setAnimatingCardId(selectedCard.id);
        setAnimatingCardObj(selectedCard);

        setPlayers(prev => prev.map(pl => pl.id === p.id ? { ...pl, hand: newHand } : pl));

        setTimeout(() => {
          const newPlayed = [...currentPlayed, { playerId: p.id, card: selectedCard }];
          setPlayedCards(newPlayed);
          setAnimatingCardId(null);
          setAnimatingCardObj(null);

          if (newPlayed.length === currentPlayers.length) {
            isEvaluatingRef.current = true;
            evaluateTrick(newPlayed);
          } else {
            setTurn((playerIdx + 1) % currentPlayers.length);
            setTurnTimer(20);
          }
          isProcessingClickRef.current = false;
        }, 750);
      };

      const evaluateTrick = (cardsOnTable) => {
        let winningCardObj = cardsOnTable[0];

        const firstWizard = cardsOnTable.find(c => c.card.type === 'wizard');
        if (firstWizard) {
          winningCardObj = firstWizard;
        } else {
          const allJesters = cardsOnTable.every(c => c.card.type === 'jester');
          if (allJesters) {
            winningCardObj = cardsOnTable[0];
          } else {
            const trumpSuit = (trumpCard && trumpCard.type === 'number') ? trumpCard.suit : null;
            const leadCardObj = cardsOnTable.find(c => c.card.type === 'number');
            const leadSuit = leadCardObj ? leadCardObj.card.suit : null;

            let bestRank = -1;

            cardsOnTable.forEach(c => {
              const card = c.card;
              if (card.type === 'number') {
                let currentRank = -1;

                if (trumpSuit && card.suit === trumpSuit) {
                  currentRank = 2000 + card.value;
                } else if (leadSuit && card.suit === leadSuit) {
                  currentRank = 1000 + card.value;
                } else {
                  currentRank = -1;
                }

                if (currentRank > bestRank) {
                  bestRank = currentRank;
                  winningCardObj = c;
                }
              }
            });
          }
        }

        const winnerId = winningCardObj.playerId;
        setCollectingWinnerId(winnerId);

        setTimeout(() => {
          setPlayers(prev => {
            const updated = prev.map(p => p.id === winnerId ? { ...p, tricks: p.tricks + 1 } : p);
            setPlayedCards([]);
            setCollectingWinnerId(null);
            isEvaluatingRef.current = false;
            isProcessingClickRef.current = false;

            const human = updated[0];
            if (human.hand.length === 0) {
              setTimeout(() => handleRoundEnd(updated, stateRef.current.round), 400);
            } else {
              setTurn(winnerId);
              setTurnTimer(20);
            }
            return updated;
          });
        }, 850);
      };

      const handleRoundEnd = (currentPlayers, currentRoundNum) => {
        let bestGuessers = [];
        let minDiff = 999;

        const calculated = currentPlayers.map(p => {
          const diff = Math.abs(p.bid - p.tricks);
          let pointsGained = (diff === 0) ? (20 + (p.tricks * 10)) : -(diff * 10);
          if (diff < minDiff) { minDiff = diff; bestGuessers = [p.id]; }
          else if (diff === minDiff) { bestGuessers.push(p.id); }
          return { ...p, score: p.score + pointsGained, pointsGained };
        });

        const nextRoundStarter = bestGuessers[Math.floor(Math.random() * bestGuessers.length)];
        setRoundSummary({ round: currentRoundNum, calculatedPlayers: calculated, nextStarterId: nextRoundStarter });
        setSummaryTimer(10);
      };

      const proceedToNextRound = () => {
        if (!roundSummary) return;
        const updated = roundSummary.calculatedPlayers;
        const nextStarter = roundSummary.nextStarterId;
        const nextR = roundSummary.round + 1;

        setPlayers(updated);
        setRoundSummary(null);

        if (nextR <= maxRounds) {
          startRound(nextR, updated, nextStarter);
        } else {
          const sortedFinal = [...updated].sort((a, b) => b.score - a.score);
          setVictoryData(sortedFinal);
          setVictoryTimer(20);

          const isHumanWinner = sortedFinal[0].isHuman;
          const activeSuit = profile.activeSuit || 'red';
          let earnedXp = isHumanWinner ? 150 : 50;

          const currentSuitData = profile.elementLevels[activeSuit] || { level: 1, xp: 0 };
          let newSuitXp = currentSuitData.xp + earnedXp;
          let newSuitLevel = currentSuitData.level;
          let xpNeededSuit = getXpNeededForElementLevel(newSuitLevel);
          while (newSuitLevel < 15 && newSuitXp >= xpNeededSuit) {
            newSuitXp -= xpNeededSuit;
            newSuitLevel += 1;
            xpNeededSuit = getXpNeededForElementLevel(newSuitLevel);
          }
          if (newSuitLevel >= 15) {
            newSuitLevel = 15;
            newSuitXp = Math.min(newSuitXp, xpNeededSuit);
          }
          const updatedElementLevels = {
            ...profile.elementLevels,
            [activeSuit]: { level: newSuitLevel, xp: newSuitXp }
          };

          let globalLevel = profile.level || 1;
          let globalXp = (profile.xp || 0) + earnedXp;

          let xpNeededGlobal = getXpNeededForGlobalLevel(globalLevel);
          while (globalLevel < 999 && globalXp >= xpNeededGlobal) {
            globalXp -= xpNeededGlobal;
            globalLevel += 1;
            xpNeededGlobal = getXpNeededForGlobalLevel(globalLevel);
          }
          if (globalLevel >= 999) {
            globalLevel = 999;
            globalXp = Math.min(globalXp, xpNeededGlobal);
          }

          const updatedProfile = { 
            ...profile, 
            offlinePlayed: (profile.offlinePlayed || 0) + 1, 
            offlineWins: isHumanWinner ? (profile.offlineWins || 0) + 1 : (profile.offlineWins || 0),
            level: globalLevel,
            xp: globalXp,
            elementLevels: updatedElementLevels
          };
          setProfile(updatedProfile);
          localStorage.setItem('wizard_profile', JSON.stringify(updatedProfile));
        }
      };

      const finishGameAndGoMenu = () => {
        setVictoryData(null);
        setShowExitConfirm(false);
        setScreen('menu');
      };

      const renderAvatarIcon = (avatarObj, sizeClass = "w-16 h-16 text-2xl") => {
        if (!avatarObj) return <div className={`${sizeClass} rounded-full bg-slate-900 border border-sky-400 flex items-center justify-center`}>🃏</div>;
        
        const suitInfo = SUITS[avatarObj.suit] || SUITS.red;

        if (avatarObj.type === 'jester') {
          return (
            <div className={`${sizeClass} rounded-full bg-slate-900 border-2 ${suitInfo.border} flex items-center justify-center shadow-xl relative overflow-hidden p-1`}>
              <div className="w-full h-full flex items-center justify-center scale-75">
                {CardArt.jester}
              </div>
            </div>
          );
        } else if (avatarObj.type === 'wizard') {
          return (
            <div className={`${sizeClass} rounded-full bg-purple-950 border-2 border-amber-300 flex items-center justify-center shadow-xl relative overflow-hidden p-1`}>
              <div className="w-full h-full flex items-center justify-center scale-75">
                {CardArt.wizard}
              </div>
            </div>
          );
        } else {
          return (
            <div className={`${sizeClass} rounded-full bg-gradient-to-b ${suitInfo.bg} border-2 ${suitInfo.border} flex flex-col items-center justify-center shadow-xl relative overflow-hidden p-0.5`}>
              <span className="text-[9px] font-black text-amber-300 leading-none">{avatarObj.value}</span>
              <div className="w-5 h-5 flex items-center justify-center my-auto scale-90">
                {suitInfo.art}
              </div>
            </div>
          );
        }
      };

      const getAvailableAvatarsForSuit = (suitKey, currentLevel) => {
        const list = [];
        list.push({ type: 'jester', suit: suitKey, label: 'Narr', unlocked: currentLevel >= 1 });
        for (let v = 1; v <= 13; v++) {
          list.push({ type: 'number', value: v, suit: suitKey, label: `Karte ${v}`, unlocked: currentLevel >= (v + 1) });
        }
        list.push({ type: 'wizard', suit: suitKey, label: 'Zauberer', unlocked: currentLevel >= 15 });
        return list;
      };

      // ---------------- 1. HAUPTMENÜ ----------------
      if (screen === 'menu') {
        return (
          <div className="relative w-full h-full bg-slate-950 flex items-center justify-center p-4 overflow-hidden">
            <div className="absolute inset-0 z-0 flex items-center justify-center">
              <img src="./1791640481183.jpg" alt="Mythos Background" className="w-full h-full object-cover drop-shadow-2xl" />
            </div>

            <div className="relative z-10 w-full max-w-sm flex flex-col gap-3 my-auto">
              <button
                onClick={() => setScreen('game_setup')}
                className="w-full py-4 rounded-2xl mythic-btn-primary text-white font-black text-lg active:scale-95 transition-transform flex items-center justify-center gap-2 shadow-2xl"
              >
                <span>⚔️</span> Spiel starten
              </button>

              <button
                onClick={() => setScreen('multiplayer')}
                className="w-full py-3.5 rounded-2xl mythic-btn-menu text-sky-200 font-bold text-base active:scale-95 transition-transform flex items-center justify-center gap-2 shadow-xl"
              >
                <span>🌐</span> Online-Lobby
              </button>

              <div className="flex gap-2">
                <button
                  onClick={() => setScreen('profile')}
                  className="flex-1 py-3 rounded-2xl mythic-btn-menu text-sky-300 font-bold text-xs active:scale-95 transition-transform flex items-center justify-center gap-1 shadow-lg"
                >
                  <span>👤</span> Profil & Stats
                </button>
                <button
                  onClick={() => setScreen('rules')}
                  className="flex-1 py-3 rounded-2xl mythic-btn-menu text-sky-300 font-bold text-xs active:scale-95 transition-transform flex items-center justify-center gap-1 shadow-lg"
                >
                  <span>📜</span> Regeln
                </button>
              </div>

              <span className="text-[9px] text-center text-slate-300 font-bold block mt-2 drop-shadow bg-slate-950/70 py-1 rounded-full backdrop-blur-md border border-sky-500/30">
                MYTHOS CARD GAME V9.9 (ELEMENT CROWN & SHAPED PODIUM)
              </span>
            </div>
          </div>
        );
      }

      // ---------------- 2. EINZELSPIEL EINSTELLUNGEN ----------------
      if (screen === 'game_setup') {
        return (
          <div className="flex flex-col landscape:flex-row h-full max-w-4xl mx-auto bg-slate-950 justify-between overflow-hidden">
            <div className="w-full h-24 landscape:h-full landscape:w-1/2 relative overflow-hidden border-b landscape:border-b-0 landscape:border-r border-sky-500/30 shadow-2xl shrink-0 flex items-center justify-center">
              <img src="./1791640481183.jpg" alt="Mythos Header" className="w-full h-full object-cover" />
            </div>

            <div className="p-4 flex-1 flex flex-col gap-3 overflow-y-auto">
              <div className="flex justify-between items-center mb-1">
                <h2 className="text-lg font-black text-sky-300 flex items-center gap-2"><span>⚔️</span> Einzelspiel</h2>
                <button onClick={() => setScreen('menu')} className="text-xs bg-slate-900 border border-slate-800 text-sky-300 px-3 py-1.5 rounded-lg font-bold">Zurück</button>
              </div>

              <div className="mythic-card p-3 rounded-2xl flex flex-col gap-3">
                <div>
                  <label className="text-[11px] font-bold text-sky-200 block mb-1">Gegner / Spieleranzahl:</label>
                  <div className="grid grid-cols-4 gap-2">
                    {[3, 4, 5, 6].map(num => (
                      <button
                        key={num}
                        onClick={() => setPlayerCount(num)}
                        className={`py-2 rounded-xl font-extrabold text-sm crystal-btn ${playerCount === num ? 'crystal-active text-white' : 'bg-slate-900 text-slate-400'}`}
                      >
                        {num}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-bold text-sky-200 block mb-1">Rundenanzahl:</label>
                  <div className="grid grid-cols-3 gap-2">
                    {[5, 10, 15].map(num => (
                      <button
                        key={num}
                        onClick={() => setMaxRounds(num)}
                        className={`py-2 rounded-xl font-bold text-xs crystal-btn ${maxRounds === num ? 'crystal-active text-white' : 'bg-slate-900 text-slate-400'}`}
                      >
                        {num} R.
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-bold text-sky-200 block mb-1">KI-Schwierigkeit:</label>
                  <div className="grid grid-cols-3 gap-2">
                    {['Leicht', 'Normal', 'Magisch'].map(diff => (
                      <button
                        key={diff}
                        onClick={() => setDifficulty(diff)}
                        className={`py-2 rounded-xl font-bold text-xs crystal-btn ${difficulty === diff ? 'crystal-active text-white' : 'bg-slate-900 text-slate-400'}`}
                      >
                        {diff}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <button
                onClick={startNewGame}
                className="w-full py-3.5 rounded-2xl mythic-btn-primary text-white font-black text-base active:scale-95 transition-transform shrink-0 shadow-2xl"
              >
                Duell beginnen ⚔️
              </button>
            </div>
          </div>
        );
      }

      // ---------------- 3. PROFIL & STATISTIKEN & AVATAR-AUSWAHL ----------------
      if (screen === 'profile') {
        const offPlayed = profile.offlinePlayed || 0;
        const offWins = profile.offlineWins || 0;
        const offLosses = Math.max(0, offPlayed - offWins);
        const offWinrate = offPlayed > 0 ? Math.round((offWins / offPlayed) * 100) : 0;

        const onPlayed = profile.onlinePlayed || 0;
        const onWins = profile.onlineWins || 0;
        const onLosses = Math.max(0, onPlayed - onWins);
        const onWinrate = onPlayed > 0 ? Math.round((onWins / onPlayed) * 100) : 0;

        const activeSuitKey = profile.activeSuit || 'red';
        
        const globalLevel = profile.level || 1;
        const globalXp = profile.xp || 0;
        const xpNeededForNextGlobal = getXpNeededForGlobalLevel(globalLevel);
        const xpProgressPercent = globalLevel >= 999 ? 100 : Math.min(100, Math.round((globalXp / xpNeededForNextGlobal) * 100));

        const activeElementData = profile.elementLevels?.[activeSuitKey] || { level: 1, xp: 0 };
        const elementLevel = activeElementData.level;
        const elementXp = activeElementData.xp;
        const xpNeededForNextElement = getXpNeededForElementLevel(elementLevel);
        const elementXpPercent = elementLevel >= 15 ? 100 : Math.min(100, Math.round((elementXp / xpNeededForNextElement) * 100));

        return (
          <div className="flex flex-col h-full max-w-md mx-auto p-4 justify-between bg-slate-950 overflow-y-auto">
            <div className="flex justify-between items-center mb-2">
              <h2 className="text-xl font-black text-sky-300">Spielerprofil</h2>
              <button onClick={() => setScreen('menu')} className="text-xs bg-slate-900 border border-slate-800 text-sky-300 px-3 py-1.5 rounded-lg font-bold">Zurück</button>
            </div>

            {showAvatarModal && (
              <div className="absolute inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col p-4 overflow-y-auto">
                <div className="flex justify-between items-center mb-3 border-b border-sky-500/30 pb-2">
                  <h3 className="font-black text-sky-300 text-sm">Avatar & Element wählen</h3>
                  <button onClick={() => setShowAvatarModal(false)} className="text-xs bg-slate-800 text-sky-300 px-3 py-1 rounded-lg font-bold">Fertig</button>
                </div>

                <div className="space-y-4 pb-4">
                  <div className="text-[11px] text-slate-400">
                    Wähle dein aktives Element. Jedes gewonnene Spiel levelt dein gewähltes Element auf!
                  </div>

                  <div className="grid grid-cols-4 gap-1.5">
                    {Object.values(SUITS).filter(s => s.key !== 'wizard').map(s => {

                  <div className="min-w-0 flex-1">
                    <div className={`font-bold truncate text-[11px] ${isCurrentTurn ? 'text-sky-300' : 'text-slate-300'}`}>{isCurrentTurn ? `▶ ${p.name}` : p.name}</div>
                    <div className="text-[10px] font-bold text-amber-400">{p.score} Ptn</div>
                    <div className="text-[9px] text-slate-300">Ansage: {p.bid !== null ? p.bid : '?'} | Stiche: {p.tricks}</div>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="flex-1 my-2 rounded-2xl bg-slate-900/50 border border-slate-800 p-2 flex flex-col justify-between items-center relative overflow-hidden">
            <div className="flex items-center gap-2">
              <span className="text-[10px] font-bold text-sky-400 uppercase">Trumpf:</span>
              {trumpCard ? <CardFace card={trumpCard} size="sm" disabled /> : <CardBack size="sm" />}
            </div>

            <div className="w-full flex-1 flex items-center justify-center p-2 relative">
              <div className={`grid grid-cols-2 gap-4 items-center justify-items-center ${collectingWinnerId !== null ? (collectingWinnerId === 0 ? 'animate-fly-to-bottom' : 'animate-fly-to-top') : ''}`}>
                {playedCards.map((pc, i) => (
                  <div key={i} className="flex flex-col items-center">
                    <span className="text-[9px] text-sky-300 mb-0.5">{players[pc.playerId]?.name}</span>
                    <CardFace card={pc.card} size="sm" disabled />
                  </div>
                ))}
              </div>

              {/* TCG ELEMENT-ANIMATION */}
              {animatingCardId && animatingCardObj && (
                <div className="absolute inset-0 flex flex-col items-center justify-center z-40 bg-black/55 backdrop-blur-[2px]">
                  <div className="relative flex flex-col items-center">
                    {renderTcgElementAnimation(animatingCardObj)}
                    <CardFace card={animatingCardObj} size="md" disabled className="animate-tcglike-slam mt-2" />
                  </div>
                </div>
              )}
            </div>

            {phase === 'bidding' && !showDiceModal && !roundSummary && !victoryData && !showExitConfirm && (
              <div className="w-full bg-slate-900/95 border border-sky-500/50 p-3 rounded-2xl flex flex-col items-center gap-2 shadow-2xl backdrop-blur-md z-20">
                <div className="flex justify-between items-center w-full px-1">
                  <span className="text-xs font-bold text-sky-300">Deine Stich-Ansage für Runde {round}:</span>
                  <span className="text-[10px] font-extrabold text-amber-400 bg-amber-950 px-2 py-0.5 rounded-full border border-sky-500/30">⏱️ Noch {biddingTimer}s</span>
                </div>
                <div className="flex gap-2 flex-wrap justify-center">
                  {Array.from({ length: round + 1 }, (_, i) => (
                    <button key={i} onClick={() => handleHumanBid(i)} className="w-10 h-10 rounded-full bg-gradient-to-b from-sky-500 to-sky-700 text-white font-black text-base shadow-lg border border-sky-300 active:scale-90 transition-transform">{i}</button>
                  ))}
                </div>
              </div>
            )}
          </div>

          <div className={`p-2 rounded-2xl border transition-all ${isHumanTurn && phase === 'playing' ? 'border-sky-400 bg-slate-800/90 shadow-xl shadow-sky-500/20 ring-1 ring-sky-400/50' : 'border-slate-800 bg-slate-900'} ${collectingWinnerId === 0 ? 'ring-2 ring-amber-400 bg-amber-950/40 shadow-[0_0_20px_#f59e0b]' : ''}`}>
            <div className="flex justify-between items-center mb-1 px-1">
              <div className="flex items-center gap-2">
                <div className="shrink-0 scale-75 origin-left">
                  {renderAvatarIcon(humanPlayer.avatarObj || profile.selectedAvatar, "w-8 h-8 text-sm")}
                </div>
                <span className={`text-xs font-bold ${isHumanTurn && phase === 'playing' ? 'text-sky-300 animate-pulse' : 'text-slate-300'}`}>
                  {isHumanTurn && phase === 'playing' ? '▶ DEINE HAND:' : 'DEINE HAND:'}
                </span>
                <span className="text-xs font-extrabold text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded-md border border-amber-500/30">{humanPlayer.score || 0} Ptn</span>
              </div>
              <span className="text-xs font-bold text-sky-400">Ansage: {humanPlayer.bid !== null ? humanPlayer.bid : '-'} | Stiche: {humanPlayer.tricks}</span>
            </div>

            <div className="flex gap-1.5 overflow-x-auto pb-1 justify-center">
              {humanPlayer.hand && humanPlayer.hand.map((card, i) => (
                <CardFace key={card.id || i} card={card} size="md" disabled={phase !== 'playing' || turn !== 0 || isEvaluatingRef.current || animatingCardId !== null || collectingWinnerId !== null || showExitConfirm} onClick={() => playCard(0, i)} />
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
