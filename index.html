                  ))}

                  <div className="bg-sky-950/80 border border-sky-400/50 p-3 rounded-2xl text-center text-xs text-sky-200 mt-3 font-bold space-y-2.5 shadow-2xl">
                    <div>{roundSummary.isLastRound ? 'Zum Endergebnis (Siegerehrung)' : `${roundSummary.calculatedPlayers.find(p => p.id === roundSummary.nextStarterId)?.name} beginnt Runde ${roundSummary.round + 1}!`}</div>
                    <div className="pt-2 border-t border-sky-500/30 flex flex-col items-center gap-1">
                      <button onClick={(e) => { 
                        e.stopPropagation(); 
                        if (roundSummary.isLastRound) {
                          const calculated = roundSummary.calculatedPlayers;
                          setRoundSummary(null);
                          triggerVictory(calculated);
                        } else {
                          proceedToNextRound();
                        }
                      }} className="w-full py-2.5 mythic-btn-primary text-white font-black text-xs rounded-xl shadow-xl active:scale-95 transition-transform flex items-center justify-center gap-2">
                        <span>{roundSummary.isLastRound ? 'Zur Siegerehrung' : 'Nächste Runde starten'}</span>
                        <span className="bg-sky-950/90 border border-sky-400/60 px-2 py-0.5 rounded-md text-[11px] font-bold text-amber-300">{summaryTimer}s</span>
                      </button>
                      <span className="text-[10px] text-slate-400 font-bold">Automatisch weiter in {summaryTimer} Sekunden</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {victoryData && !showExitConfirm && (() => {
            const winner = victoryData[0] || {};
            const winnerAvatar = winner.avatarObj || profile.selectedAvatar;
            const winnerSuitKey = winnerAvatar?.suit || 'yellow';
            const suitTheme = SUITS[winnerSuitKey] || SUITS.yellow;

            return (
              <div onClick={finishGameAndGoMenu} className="absolute inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-between p-4 cursor-pointer select-none overflow-y-auto menu-scroll-container">
                <div className="text-center mt-2">
                  <h2 className="text-2xl font-black drop-shadow tracking-widest" style={{ color: suitTheme.primaryColor }}>SIEGEREHRUNG</h2>
                  <p className="text-xs text-sky-300 font-bold mt-0.5">Das große Turnier ist zu Ende</p>
                </div>

                <div className="my-auto flex flex-col items-center w-full">
                  <div className="relative flex flex-col items-center mb-3">
                    
                    <div className="relative z-20 flex flex-col items-center">
                      <div className="absolute -top-7 animate-bounce drop-shadow z-30">
                        {suitTheme.crownSvg}
                      </div>
                      
                      <div className="w-24 h-24 rounded-full border-4 p-1 flex items-center justify-center shadow-2xl bg-slate-900 relative overflow-visible mt-2" style={{ borderColor: suitTheme.primaryColor, boxShadow: `0 0 35px ${suitTheme.glowColor}` }}>
                        <div className="absolute top-0 inset-x-0 h-8 bg-gradient-to-b from-white/20 to-transparent rounded-t-full pointer-events-none z-10"></div>
                        <div className="w-full h-full rounded-full overflow-hidden flex items-center justify-center">
                          {renderAvatarIcon(winnerAvatar, "w-full h-full")}
                        </div>
                      </div>
                    </div>
                    
                    <div 
                      className={`w-48 h-20 mt-[-16px] flex flex-col items-center justify-center element-podium-active z-10 ${suitTheme.podiumClass}`}
                      style={{ '--glow-color': suitTheme.glowColor }}
                    >
                      <span className="text-xs font-black text-white uppercase tracking-wider drop-shadow mt-3">{winner.name}</span>
                      <span className="text-sm font-black text-amber-300 drop-shadow">{winner.score} Ptn</span>
                    </div>
                  </div>

                  <div className="w-full bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-2 text-xs">
                    <div className="font-bold text-sky-300 mb-1 border-b border-slate-800 pb-1 text-center">Finale Rangliste:</div>
                    {victoryData.map((p, idx) => (
                      <div key={p.id} className={`p-2 rounded-xl flex justify-between items-center ${idx === 0 ? 'bg-slate-950/80 border text-white' : 'bg-slate-950/60 text-slate-300'}`} style={{ borderColor: idx === 0 ? suitTheme.primaryColor : undefined }}>
                        <div className="flex items-center gap-2">
                          <span className="font-black text-xs text-sky-400 w-4">#{idx + 1}</span>
                          <div className="w-6 h-6 rounded-full overflow-hidden flex items-center justify-center">
                            {renderAvatarIcon(p.avatarObj || profile.selectedAvatar, "w-full h-full")}
                          </div>
                          <span className="font-bold truncate">{p.name}</span>
                        </div>
                        <span className="font-black text-amber-400">{p.score} Ptn</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="w-full flex flex-col items-center gap-1 mb-2">
                  <div className="w-full py-3.5 mythic-btn-primary text-white font-black text-sm rounded-2xl shadow-2xl text-center">Tippe irgendwo, um fortzufahren</div>
                  <span className="text-[11px] text-sky-400 font-extrabold bg-sky-950 px-3 py-1 rounded-full border border-sky-500/30">Schließt in {victoryTimer}s</span>
                </div>
              </div>
            );
          })()}

          {/* OBERER BEREICH: Rundeninfo & Buttons */}
          <div className="flex justify-between items-center bg-slate-900/90 px-2.5 py-0.5 rounded-lg border border-slate-800 shrink-0 shadow">
            <span className="text-[11px] font-bold text-sky-400">Runde {round} / {maxRounds}</span>
            <div className="flex items-center gap-1.5">
              <button 
                onClick={() => setShowVolumePopup(!showVolumePopup)} 
                className={`text-[10px] px-2 py-0.5 rounded-md font-bold transition-all shadow flex items-center gap-1 ${!isMuted ? 'bg-slate-800 hover:bg-slate-700 text-sky-300 border border-sky-500/30' : 'bg-red-950 text-red-300 border border-red-500/50'}`}
                title="Lautstärke & Mute"
              >
                {!isMuted ? '🔊' : '🔇'}
              </button>
              <button onClick={() => setShowExitConfirm(true)} className="text-[10px] bg-slate-800 hover:bg-slate-700 active:scale-95 text-sky-300 border border-sky-500/30 px-2.5 py-0.5 rounded-md font-bold transition-all shadow">Menü</button>
            </div>
          </div>

          {/* GEGNER-LEISTE OBEN */}
          <div className="grid grid-cols-3 gap-1 shrink-0 my-0.5">
            {players.filter(p => !p.isHuman).map(p => {
              const isCurrentTurn = (turn === p.id);
              const isWinnerCollecting = (collectingWinnerId === p.id);
              return (
                <div key={p.id} className={`p-1 px-1.5 rounded-lg border flex items-center gap-1.5 text-[10px] transition-all ${isCurrentTurn ? 'border-sky-400 bg-slate-800 shadow-md shadow-sky-500/20' : 'border-slate-800 bg-slate-900/60'} ${isWinnerCollecting ? 'ring-2 ring-amber-400 bg-amber-950/40 shadow-[0_0_15px_#f59e0b]' : ''}`}>
                  <div className="shrink-0 scale-75 origin-left">
                    {renderAvatarIcon(p.avatarObj, "w-6 h-6 text-[9px]")}
                  </div>
                  <div className="min-w-0 flex-1 overflow-hidden leading-tight">
                    <div className={`font-bold truncate text-[10px] ${isCurrentTurn ? 'text-sky-300' : 'text-slate-300'}`}>{isCurrentTurn ? `> ${p.name}` : p.name}</div>
                    <div className="text-[9px] font-bold text-sky-400">Ans: {p.bid !== null ? p.bid : '-'} | Stich: {p.tricks}</div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* HAUPT-SPIELFELD (Tisch) */}
          <div className="flex-1 rounded-xl border border-sky-500/40 p-1 flex flex-col justify-between items-center relative overflow-hidden shadow-xl bg-slate-950 my-1">
            <div className="absolute inset-0 z-0 pointer-events-none">
              <img src="./1791660049147.jpg" alt="Spieltisch Hintergrund" className="w-full h-full object-cover" />
              <div className="absolute inset-0 bg-slate-950/40 backdrop-brightness-95"></div>
            </div>

            <div className="flex items-center gap-1.5 z-10 shrink-0">
              <span className="text-[10px] font-bold text-sky-300 uppercase drop-shadow">Trumpf:</span>
              {trumpCard ? <CardFace card={trumpCard} size="sm" disabled /> : <CardBack size="sm" />}
            </div>

            {/* ABLAGE-TISCH IM 3ER-GRID */}
            <div className="w-full flex-1 flex items-center justify-center p-0.5 relative z-10 overflow-y-auto">
              <div className={`grid grid-cols-3 gap-2 items-center justify-items-center max-w-sm ${collectingWinnerId !== null ? (collectingWinnerId === 0 ? 'animate-fly-to-bottom' : 'animate-fly-to-top') : ''}`}>
                {playedCards.map((pc, i) => (
                  <div key={i} className="flex flex-col items-center scale-75 origin-center">
                    <span className="text-[10px] font-black text-sky-200 mb-1 truncate max-w-[90px] drop-shadow bg-slate-950/80 px-2 py-0.5 rounded border border-sky-500/30">{players[pc.playerId]?.name}</span>
                    <CardFace card={pc.card} size="sm" disabled />
                  </div>
                ))}
              </div>

              {animatingCardId && animatingCardObj && (
                <div className="absolute inset-0 flex flex-col items-center justify-center z-40 bg-black/60 backdrop-blur-[2px]">
                  <div className="relative flex flex-col items-center">
                    {renderTcgElementAnimation(animatingCardObj)}
                    <CardFace card={animatingCardObj} size="md" disabled className="animate-tcglike-slam mt-2" />
                  </div>
                </div>
              )}
            </div>

            {/* ANSAGEN-AUSWAHL IM TISCH */}
            <div className="w-full h-9 flex items-center justify-center z-20 shrink-0">
              {phase === 'bidding' && !showDiceModal && !roundSummary && !victoryData && !showExitConfirm ? (
                <div className="w-full bg-slate-900/95 border border-sky-500/50 p-1 rounded-lg flex flex-col items-center gap-0.5 shadow-xl backdrop-blur-md">
                  <div className="flex justify-between items-center w-full px-1">
                    <span className="text-[9px] font-bold text-sky-300">Ansage (Runde {round}):</span>
                    <span className="text-[9px] font-extrabold text-amber-400 bg-amber-950 px-1.5 py-0.2 rounded-full border border-sky-500/30">{biddingTimer}s</span>
                  </div>
                  <div className="flex gap-1 flex-wrap justify-center overflow-x-auto max-w-full">
                    {Array.from({ length: round + 1 }, (_, i) => (
                      <button key={i} onClick={() => handleHumanBid(i)} className="w-5 h-5 rounded-full bg-gradient-to-b from-sky-500 to-sky-700 text-white font-black text-[9px] shadow border border-sky-300 active:scale-90 transition-transform">{i}</button>
                    ))}
                  </div>
                </div>
              ) : null}
            </div>
          </div>

          {/* DEINE HANDKARTEN */}
          <div className={`p-1.5 mb-1 rounded-xl border transition-all shrink-0 ${isHumanTurn && phase === 'playing' ? 'border-sky-400 bg-slate-800/95 shadow-xl shadow-sky-500/30 ring-2 ring-sky-400/60' : 'border-slate-800 bg-slate-900'} ${collectingWinnerId === 0 ? 'ring-2 ring-amber-400 bg-amber-950/40 shadow-[0_0_20px_#f59e0b]' : ''}`}>
            <div className="flex justify-between items-center mb-1 px-1">
              <div className="flex items-center gap-1.5">
                <div className="shrink-0 scale-75 origin-left">
                  {renderAvatarIcon(humanPlayer.avatarObj || profile.selectedAvatar, "w-6 h-6 text-[9px]")}
                </div>
                <span className={`text-[10px] font-black tracking-wide ${isHumanTurn && phase === 'playing' ? 'text-sky-300 animate-pulse' : 'text-slate-300'}`}>
                  DEINE HAND:
                </span>
              </div>
              <div className="flex items-center gap-2">
                {isHumanTurn && phase === 'playing' && !isEvaluatingRef.current && !animatingCardId && !collectingWinnerId && !showDiceModal && !roundSummary && !victoryData && !showExitConfirm && (
                  <span className="text-[10px] font-extrabold text-amber-400 bg-amber-950/90 px-2 py-0.5 rounded-full border border-amber-500/40 animate-pulse">Zug: {turnTimer}s</span>
                )}
                <span className="text-[10px] font-bold text-sky-400">Ans: {humanPlayer.bid !== null ? humanPlayer.bid : '-'} | Stich: {humanPlayer.tricks}</span>
              </div>
            </div>

            {/* HANDKARTEN SCROLL-CONTAINER */}
            <div className="w-full flex justify-start sm:justify-center items-end py-1 overflow-x-auto hand-scroll-container">
              <div className="flex items-end px-2 py-1 min-w-full justify-start sm:justify-center">
                {humanPlayer.hand && humanPlayer.hand.map((card, idx) => (
                  <div 
                    key={card.id || idx} 
                    className="transition-all duration-200"
                    style={{ 
                      marginLeft: shouldOverlapCards && idx > 0 ? `-35px` : `0px`,
                      zIndex: idx 
                    }}
                  >
                    <CardFace 
                      card={card} 
                      size="md" 
                      disabled={phase !== 'playing' || turn !== 0 || isEvaluatingRef.current || animatingCardId !== null || collectingWinnerId !== null || showExitConfirm} 
                      onClick={() => playCard(0, idx)} 
                    />
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
