<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wizard Card Game</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: white; font-family: sans-serif; user-select: none; }
    .stone-card-back {
      background: radial-gradient(circle at center, #2a201b 0%, #110c0a 100%);
      border: 2px solid #3a2e2b;
      box-shadow: inset 0 0 15px #000;
    }
  </style>
</head>
<body class="h-screen overflow-hidden">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUITS = {
      yellow: { name: 'Gelb', title: 'die standarte', symbol: '🗝️', bg: 'from-amber-950 via-yellow-900 to-amber-950', border: 'border-yellow-500' },
      red: { name: 'Rot', title: 'die axt', symbol: '🪓', bg: 'from-red-950 via-rose-900 to-red-950', border: 'border-red-500' },
      green: { name: 'Grün', title: 'der bogen', symbol: '🏹', bg: 'from-emerald-950 via-green-900 to-emerald-950', border: 'border-emerald-500' },
      blue: { name: 'Blau', title: 'der dolch', symbol: '🗡️', bg: 'from-blue-950 via-indigo-900 to-blue-950', border: 'border-blue-500' }
    };

    function CardBack({ size = "md" }) {
      const dim = size === "sm" ? "w-16 h-24" : size === "lg" ? "w-28 h-40" : "w-20 h-32";
      return (
        <div class={`${dim} stone-card-back rounded-xl p-2 flex flex-col justify-between items-center relative overflow-hidden shadow-2xl`}>
          <span class="text-[11px] font-black tracking-widest text-amber-500 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">WIZARD</span>
          <div class="grid grid-cols-2 gap-1.5 my-auto text-sm opacity-90">
            <span class="text-emerald-400">🏹</span>
            <span class="text-blue-400">🗡️</span>
            <span class="text-yellow-400">🗝️</span>
            <span class="text-red-400">🪓</span>
          </div>
          <div class="w-full h-2 bg-gradient-to-r from-orange-600 via-red-500 to-amber-600 blur-[1px] rounded-full"></div>
        </div>
      );
    }

    function CardFace({ card, size = "md", onClick, disabled }) {
      const dim = size === "sm" ? "w-16 h-24 text-xs" : size === "lg" ? "w-28 h-40 text-base" : "w-20 h-32 text-sm";
      if (!card) return null;

      const isSpecial = card.type === 'wizard' || card.type === 'jester';
      const suitInfo = SUITS[card.suit] || {};

      const bgClass = isSpecial 
        ? (card.type === 'wizard' ? 'from-purple-950 via-indigo-900 to-slate-950 border-purple-500' : 'from-slate-900 via-zinc-800 to-slate-950 border-slate-500')
        : `${suitInfo.bg} ${suitInfo.border}`;

      return (
        <div 
          onClick={!disabled ? onClick : undefined}
          class={`${dim} rounded-xl bg-gradient-to-b ${bgClass} border-2 p-1.5 flex flex-col justify-between items-center relative shadow-xl cursor-pointer hover:-translate-y-1 transition-all`}
        >
          {/* Ecken-Zahlen Oben */}
          <div class="w-full flex justify-between font-extrabold text-amber-300 drop-shadow">
            <span>{card.type === 'number' ? card.value : (card.type === 'wizard' ? 'Z' : 'N')}</span>
            <span>{card.type === 'number' ? card.value : (card.type === 'wizard' ? 'Z' : 'N')}</span>
          </div>

          {/* Symbol & Titel */}
          <div class="flex flex-col items-center">
            <span class="text-2xl drop-shadow-md">
              {card.type === 'wizard' ? '🧙‍♂️' : card.type === 'jester' ? '🃏' : suitInfo.symbol}
            </span>
            <span class="text-[8px] font-serif text-amber-200/80 tracking-tight leading-none uppercase mt-0.5">
              {card.type === 'wizard' ? 'Zauberer' : card.type === 'jester' ? 'Narr' : suitInfo.title}
            </span>
          </div>

          {/* Ecken-Zahlen Unten (Auf dem Kopf) */}
          <div class="w-full flex justify-between font-extrabold text-amber-300 drop-shadow rotate-180">
            <span>{card.type === 'number' ? card.value : (card.type === 'wizard' ? 'Z' : 'N')}</span>
            <span>{card.type === 'number' ? card.value : (card.type === 'wizard' ? 'Z' : 'N')}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [round, setRound] = useState(1);
      const [phase, setPhase] = useState('bidding'); // bidding, playing
      const [playerHand, setPlayerHand] = useState([
        { type: 'number', value: 13, suit: 'yellow' },
        { type: 'wizard', value: 14 },
        { type: 'number', value: 5, suit: 'red' }
      ]);
      const [trumpCard, setTrumpCard] = useState({ type: 'number', value: 8, suit: 'green' });
      const [myBid, setMyBid] = useState(null);

      return (
        <div class="flex flex-col h-full max-w-md mx-auto p-3 justify-between bg-slate-950">
          {/* Status-Leiste */}
          <div class="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
            <span class="font-bold text-amber-400 text-sm">Runde {round} / 15</span>
            <span class="text-xs text-slate-300">Phase: {phase === 'bidding' ? 'Stich-Ansage' : 'Spiel'}</span>
          </div>

          {/* Spielfeld / Tisch */}
          <div class="flex-1 my-3 rounded-2xl bg-slate-900/40 border border-slate-800/80 p-4 flex flex-col justify-between items-center relative">
            
            {/* Trumpf-Bereich */}
            <div class="flex flex-col items-center gap-1">
              <span class="text-[11px] font-medium text-amber-400/80 uppercase tracking-wider">Aufgedeckte Trumpfkarte</span>
              {trumpCard ? <CardFace card={trumpCard} size="lg" disabled /> : <CardBack size="lg" />}
            </div>

            {/* Stich-Ansage Overlay über dem Tisch */}
            {phase === 'bidding' && (
              <div class="w-full bg-slate-900/95 border border-amber-500/40 p-3 rounded-2xl flex flex-col items-center gap-2 shadow-2xl backdrop-blur-md">
                <span class="text-xs font-semibold text-amber-300">Wie viele Stiche wirst du machen?</span>
                <div class="flex gap-2 flex-wrap justify-center">
                  {Array.from({ length: round + 1 }, (_, i) => (
                    <button
                      key={i}
                      onClick={() => { setMyBid(i); setPhase('playing'); }}
                      class="w-11 h-11 rounded-full bg-amber-600 hover:bg-amber-500 text-white font-extrabold text-lg shadow-lg active:scale-90 transition-transform"
                    >
                      {i}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Handkarten des Spielers */}
          <div class="bg-slate-900 p-3 rounded-2xl border border-slate-800">
            <div class="flex justify-between items-center mb-2 px-1">
              <span class="text-xs text-slate-400 font-medium">Deine Handkarten:</span>
              {myBid !== null && <span class="text-xs font-bold text-amber-400">Vorhersage: {myBid} Stich(e)</span>}
            </div>
            <div class="flex gap-2 overflow-x-auto pb-1 justify-center">
              {playerHand.map((card, i) => (
                <CardFace key={i} card={card} size="md" />
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
