<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mythos Card Game</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Google Fonts: Cinzel Einbindung -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    body { 
      background-color: #030712; 
      color: white; 
      font-family: 'Cinzel', serif; 
      user-select: none; 
    }
    .card-art-box {
      background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.6) 100%);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .mythic-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 25px rgba(14, 165, 233, 0.2);
    }
    .mythic-btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 50%, #075985 100%);
      border: 1px solid #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }
    .mythic-btn-menu {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(30, 41, 59, 0.85) 100%);
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.1);
      backdrop-filter: blur(8px);
    }
    .crystal-btn {
      transition: all 0.2s ease-in-out;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .crystal-active {
      background: radial-gradient(circle at center, #0284c7 0%, #0369a1 100%);
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
      transform: scale(1.05);
    }

    /* Animations */
    @keyframes rollDiceAction {
      0% { transform: rotate(0deg) scale(0.6); }
      50% { transform: rotate(720deg) scale(1.3); }
      100% { transform: rotate(1080deg) scale(1); }
    }
    .animate-dice-active {
      animation: rollDiceAction 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes elementPodiumGlow {
      0%, 100% { box-shadow: 0 0 35px var(--glow-color), inset 0 0 20px var(--glow-color); }
      50% { box-shadow: 0 0 65px var(--glow-color), inset 0 0 40px var(--glow-color); }
    }
    .element-podium-active {
      animation: elementPodiumGlow 2.5s infinite ease-in-out;
    }

    /* GESCHWUNGENES WELLEN-WASSER-PODEST */
    .podium-water {
      background: linear-gradient(135deg, rgba(3, 105, 161, 0.95), rgba(2, 132, 199, 0.9), rgba(3, 7, 18, 0.98));
      border: 2px solid #38bdf8;
      clip-path: polygon(10% 15%, 30% 0%, 50% 15%, 70% 0%, 90% 15%, 100% 35%, 95% 100%, 5% 100%, 0% 35%);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(186, 230, 253, 0.35) 0%, transparent 60%),
        repeating-linear-gradient(-30deg, rgba(56, 189, 248, 0.2) 0px, rgba(56, 189, 248, 0.2) 10px, transparent 10px, transparent 20px);
      background-size: 100% 100%, 100% 100%;
    }

    /* LODERNDES FEUER-PODEST */
    .podium-fire {
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.95), rgba(185, 28, 28, 0.9), rgba(3, 7, 18, 0.98));
      border: 2px solid #ef4444;
      clip-path: polygon(15% 0%, 85% 0%, 100% 25%, 90% 100%, 10% 100%, 0% 25%);
      background-image: 
        repeating-linear-gradient(45deg, rgba(252, 165, 165, 0.2) 0, rgba(252, 165, 165, 0.2) 12px, transparent 12px, transparent 24px),
        radial-gradient(circle at 50% 100%, rgba(245, 158, 11, 0.6) 0%, transparent 70%);
      background-size: 100% 100%, 100% 100%;
    }

    /* DIAMANTEN-KRISTALL-PODEST */
    .podium-diamond {
      background: linear-gradient(135deg, rgba(5, 150, 105, 0.95), rgba(4, 120, 87, 0.9), rgba(3, 7, 18, 0.98));
      border: 2px solid #34d399;
      clip-path: polygon(15% 0%, 85% 0%, 100% 30%, 95% 100%, 5% 100%, 0% 30%);
      background-image: 
        linear-gradient(60deg, rgba(167, 243, 208, 0.25) 25%, transparent 25%), 
        linear-gradient(120deg, rgba(167, 243, 208, 0.25) 25%, transparent 25%),
        linear-gradient(180deg, rgba(5, 150, 105, 0.4) 0%, rgba(3, 7, 18, 0.8) 100%);
      background-size: 20px 20px, 20px 20px, 100% 100%;
    }

    /* TORNADO-WIND-PODEST */
    .podium-wind {
      background: linear-gradient(to bottom, rgba(217, 119, 6, 0.9), rgba(15, 23, 42, 0.98));
      border: 2px solid #f59e0b;
      border-radius: 2rem;
      box-shadow: inset 0 0 25px rgba(252, 211, 77, 0.4);
      background-image: repeating-linear-gradient(-45deg, rgba(253, 230, 138, 0.15) 0px, rgba(253, 230, 138, 0.15) 12px, transparent 12px, transparent 24px);
    }

    @keyframes tornadoSpinSlow {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.03); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .animate-tornado {
      animation: tornadoSpinSlow 4s infinite linear;
    }

    /* Wuchtige TCG Impact-Slam Animation */
    @keyframes tcglikeSlam {
      0% { transform: translateY(180px) scale(1.7) rotate(-15deg); opacity: 0; filter: brightness(2.5) contrast(1.5); }
      35% { opacity: 1; transform: translateY(-16px) scale(1.2) rotate(4deg); }
      70% { transform: translateY(6px) scale(0.92) rotate(-2deg); }
      100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; filter: brightness(1); }
    }
    .animate-tcglike-slam {
      animation: tcglikeSlam 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      z-index: 30;
    }

    /* Epische TCG Element-Grafik-VFX */
    @keyframes elementVfxBurst {
      0% { transform: scale(0.3) rotate(0deg); opacity: 0; }
      40% { transform: scale(1.4) rotate(120deg); opacity: 1; filter: drop-shadow(0 0 35px currentColor); }
      100% { transform: scale(2.3) rotate(240deg); opacity: 0; }
    }
    .tcg-element-vfx {
      position: absolute;
      pointer-events: none;
      animation: elementVfxBurst 0.75s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      z-index: 40;
    }

    /* Animation: Karten schweben zum Gewinner des Stiches */
    @keyframes floatToWinnerTop {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-180px) scale(0.3); opacity: 0; filter: drop-shadow(0 0 20px #f59e0b); }
    }
    @keyframes floatToWinnerBottom {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(180px) scale(0.3); opacity: 0; filter: drop-shadow(0 0 20px #f59e0b); }
    }
    .animate-fly-to-top {
      animation: floatToWinnerTop 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .animate-fly-to-bottom {
      animation: floatToWinnerBottom 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
  </style>
</head>

    // --- SOUND ENGINE ---
    class SoundEngine {
      constructor() {
        this.menuMusic = null;
        this.playMusicAudio = null;
      }
      init() {
        if (!this.menuMusic) {
          this.menuMusic = new Audio('./mythosmainmenu.mp3');
          this.menuMusic.loop = true;
          this.menuMusic.volume = 0.5;
        }
        if (!this.playMusicAudio) {
          this.playMusicAudio = new Audio('./mythosplay.mp3');
          this.playMusicAudio.loop = true;
          this.playMusicAudio.volume = 0.5;
        }
      }
      playMenu() {
        this.init();
        if (this.playMusicAudio && !this.playMusicAudio.paused) {
          this.playMusicAudio.pause();
        }
        if (this.menuMusic && this.menuMusic.paused) {
          this.menuMusic.play().catch(e => console.log("Autoplay waiting for interaction"));
        }
      }
      playBattle() {
        this.init();
        if (this.menuMusic && !this.menuMusic.paused) {
          this.menuMusic.pause();
        }
        if (this.playMusicAudio && this.playMusicAudio.paused) {
          this.playMusicAudio.play().catch(e => console.log("Autoplay waiting for interaction"));
        }
      }
      stopAll() {
        if (this.menuMusic && !this.menuMusic.paused) {
          this.menuMusic.pause();
        }
        if (this.playMusicAudio && !this.playMusicAudio.paused) {
          this.playMusicAudio.pause();
        }
      }
      setVolume(volume) {
        if (this.menuMusic) this.menuMusic.volume = volume;
        if (this.playMusicAudio) this.playMusicAudio.volume = volume;
      }
    }

    const soundEngine = new SoundEngine();

    const BANNED_WORDS = [
      'arsch', 'idiot', 'scheisse', 'scheiße', 'wichser', 'hurensohn', 'spast', 'depp',
      'fick', 'fucker', 'fuck', 'bitch', 'asshole', 'bastard', 'nazi', 'hitler', 'cunt',
      'nigger', 'nigga', 'piss', 'penis', 'vagina', 'neger', 'wank', 'retard'

    const validatePlayerName = (input) => {
      const trimmed = input.trim();
      if (trimmed.length < 3) return { valid: false, error: 'Name muss mind. 3 Zeichen lang sein!' };
      if (trimmed.length > 16) return { valid: false, error: 'Name darf max. 16 Zeichen lang sein!' };
      
      const cleanRegex = /^[a-zA-Z0-9_äöüÄÖÜß\s]+$/;
      if (!cleanRegex.test(trimmed)) return { valid: false, error: 'Keine Sonderzeichen erlaubt!' };

      const lower = trimmed.toLowerCase().replace(/[\s_0-9]/g, '');
      const containsBanned = BANNED_WORDS.some(word => lower.includes(word));
      if (containsBanned) return { valid: false, error: 'Unangebrachter Name nicht erlaubt!' };

      return { valid: true, error: '' };
    };

    const getCryptoRandomDice = () => {
      const array = new Uint32Array(1);
      window.crypto.getRandomValues(array);
      return (array[0] % 6) + 1;
    };

    const shuffleArray = (array) => {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    };

          {isRedTwelve && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791699299500.jpg" alt="Rot 12" className="w-full h-full object-cover" /><div className="absolute inset-0 bg-red-950/15 backdrop-brightness-95"></div></div>}
          {isRedThirteen && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791699330751.jpg" alt="Rot 13" className="w-full h-full object-cover" /><div className="absolute inset-0 bg-red-950/15 backdrop-brightness-95"></div></div>}

          {isYellowOne && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791701576314.jpg" alt="Gelb 1" className="w-full h-full object-cover" /><div className="absolute inset-0 bg-amber-950/15 backdrop-brightness-95"></div></div>}
          {isYellowTwo && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791701667083.jpg" alt="Gelb 2" className="w-full h-full object-cover" /><div className="absolute inset-0 bg-amber-950/15 backdrop-brightness-95"></div></div>}
          {isYellowThree && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791701691014.jpg" alt="Gelb 3" className="w-full h-full object-cover" /><div className="absolute inset-0 bg-amber-950/15 backdrop-brightness-95"></div></div>}
          {isYellowFour && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791701832104.jpg" alt="Gelb 4" className="w-full h-full object-cover" /><div className="absolute inset-0 bg-amber-950/15 backdrop-brightness-95"></div></div>}
          {isYellowFive && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791701870106.jpg" alt="Gelb 5" className="w-full h-full object-cover" /><div className="absolute inset-0 bg-amber-950/15 backdrop-brightness-95"></div></div>}
          {isYellowSix && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791702013917.jpg" alt="Gelb 6" className="w-full h-full object-cover" /><div className="absolute inset-0 bg-amber-950/15 backdrop-brightness-95"></div></div>}
          {isYellowSeven && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791702218773.jpg" alt="Gelb 7" className="w-full h-full object-cover" /><div className="absolute inset-0 bg-amber-950/15 backdrop-brightness-95"></div></div>}
          {isYellowEight && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791702263173.jpg" alt="Gelb 8" className="w-full h-full object-cover" /><div className="absolute inset-0 bg-amber-950/15 backdrop-brightness-95"></div></div>}
          {isYellowNine && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791702444012.jpg" alt="Gelb 9" className="w-full h-full object-cover" /><div className="absolute inset-0 bg-amber-950/15 backdrop-brightness-95"></div></div>}
          {isYellowTen && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791702517230.jpg" alt="Gelb 10" className="w-full h-full object-cover" /><div className="absolute inset-0 bg-amber-950/15 backdrop-brightness-95"></div></div>}
          {isYellowEleven && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791705657196.jpg" alt="Gelb 11" className="w-full h-full object-cover" /><div className="absolute inset-0 bg-amber-950/15 backdrop-brightness-95"></div></div>}
          {isYellowTwelve && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791705766319.jpg" alt="Gelb 12" className="w-full h-full object-cover" /><div className="absolute inset-0 bg-amber-950/15 backdrop-brightness-95"></div></div>}
          {isYellowThirteen && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791705774151.jpg" alt="Gelb 13" className="w-full h-full object-cover" /><div className="absolute inset-0 bg-amber-950/15 backdrop-brightness-95"></div></div>}

          <div className={`w-full flex justify-end font-black text-xs drop-shadow z-10 px-1 ${cornerColorClass}`}>
            <span>{cornerText}</span>
          </div>

          <div className="flex-1 my-0.5 w-full flex items-center justify-center z-10"></div>

          <div className={`w-full flex justify-start font-black text-xs drop-shadow rotate-180 z-10 px-1 ${cornerColorClass}`}>
            <span>{cornerText}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [screen, setScreen] = useState('menu');
      const [showExitConfirm, setShowExitConfirm] = useState(false);
      const [showAvatarModal, setShowAvatarModal] = useState(false);

      const [musicVolume, setMusicVolume] = useState(() => {
        const saved = localStorage.getItem('wizard_music_vol');
        return saved !== null ? parseFloat(saved) : 0.5;
      });

      // Musiksteuerung: Menü-Musik in Menüs, Spiel-Musik (mythosplay.mp3) während des Spiels (inkl. Ansagen und Rundenwechsel)
      useEffect(() => {
        if (screen === 'menu' || screen === 'settings' || screen === 'game_setup' || screen === 'profile' || screen === 'multiplayer' || screen === 'rules') {
          soundEngine.playMenu();
        } else if (screen === 'game') {
          // Läuft während des gesamten Spiels weiter, stoppt nur beim Start-Würfeln, bei aktiver Siegerehrung oder beim Verlassen
          if (!showDiceModal && !victoryData && !showExitConfirm) {
            soundEngine.playBattle();
          } else {
            soundEngine.stopAll();
          }
        }
      }, [screen, showDiceModal, victoryData, showExitConfirm]);

      const handleVolumeChange = (newVol) => {
        setMusicVolume(newVol);
        localStorage.setItem('wizard_music_vol', newVol);
        soundEngine.setVolume(newVol);
      };

      const handleUserInteraction = () => {
        if (screen === 'menu' || screen === 'settings' || screen === 'game_setup' || screen === 'profile' || screen === 'multiplayer' || screen === 'rules') {
          soundEngine.playMenu();
        } else if (screen === 'game' && !showDiceModal && !victoryData && !showExitConfirm) {
          soundEngine.playBattle();
        }
      };
      
      const [profile, setProfile] = useState(() => {
        const saved = localStorage.getItem('wizard_profile');
        const defaultProf = { 
          name: 'Erzmagier', 
          level: 1, 
          xp: 0, 
          activeSuit: 'yellow',
          selectedAvatar: { type: 'jester', suit: 'yellow' },
          elementLevels: {
            red: { level: 1, xp: 0 },
            blue: { level: 1, xp: 0 },
            green: { level: 1, xp: 0 },
            yellow: { level: 1, xp: 0 }
          },
          offlinePlayed: 3,
          offlineWins: 0,
          onlinePlayed: 0,
          onlineWins: 0
        };
        if (!saved) return defaultProf;
        const parsed = JSON.parse(saved);
        if (parsed.elementLevels && parsed.elementLevels.wizard) {
          delete parsed.elementLevels.wizard;
        }
        return {
          ...defaultProf,
          ...parsed,
          level: parsed.level ?? 1,
          xp: parsed.xp ?? 0,
          elementLevels: parsed.elementLevels || defaultProf.elementLevels,
          selectedAvatar: parsed.selectedAvatar || defaultProf.selectedAvatar,
          activeSuit: (parsed.activeSuit === 'wizard' ? 'yellow' : parsed.activeSuit) || defaultProf.activeSuit,
          offlinePlayed: parsed.offlinePlayed ?? 0,
          offlineWins: parsed.offlineWins ?? 0,
          onlinePlayed: parsed.onlinePlayed ?? 0,
          onlineWins: parsed.onlineWins ?? 0
        };
      });

      const [isEditingName, setIsEditingName] = useState(false);
      const [nameInput, setNameInput] = useState(profile.name);
      const [nameError, setNameError] = useState('');

      const handleSaveName = () => {
        const check = validatePlayerName(nameInput);
        if (!check.valid) {
          setNameError(check.error);
          return;
        }
        const updated = { ...profile, name: nameInput.trim() };
        setProfile(updated);
        localStorage.setItem('wizard_profile', JSON.stringify(updated));
        setIsEditingName(false);
        setNameError('');
      };

      const [playerCount, setPlayerCount] = useState(4);
      const [maxRounds, setMaxRounds] = useState(15);
      const [difficulty, setDifficulty] = useState('Normal');

      const [round, setRound] = useState(1);
      const [phase, setPhase] = useState('bidding');
      const [players, setPlayers] = useState([]);
      const [trumpCard, setTrumpCard] = useState(null);
      const [playedCards, setPlayedCards] = useState([]);
      const [turn, setTurn] = useState(0);

      const [animatingCardId, setAnimatingCardId] = useState(null);
      const [animatingCardObj, setAnimatingCardObj] = useState(null);
      const [collectingWinnerId, setCollectingWinnerId] = useState(null);

      const isEvaluatingRef = useRef(false);
      const isProcessingClickRef = useRef(false);
      const stateRef = useRef({});
      stateRef.current = { screen, phase, turn, players, playedCards, trumpCard, round, maxRounds, animatingCardId, collectingWinnerId, musicVolume };

      const [showDiceModal, setShowDiceModal] = useState(false);
      const [isDiceRolling, setIsDiceRolling] = useState(false);
      const [diceRolls, setDiceRolls] = useState(null);
      const [diceWinner, setDiceWinner] = useState(null);
      const [diceTimer, setDiceTimer] = useState(20);
      const [resultTimer, setResultTimer] = useState(10);

      const [biddingTimer, setBiddingTimer] = useState(20);
      const [turnTimer, setTurnTimer] = useState(20);

      const [roundSummary, setRoundSummary] = useState(null);
      const [summaryTimer, setSummaryTimer] = useState(10);

      const [victoryData, setVictoryData] = useState(null);
      const [victoryTimer, setVictoryTimer] = useState(20);

      useEffect(() => {
        let interval = null;
        if (showDiceModal && !diceRolls && !isDiceRolling) {
          interval = setInterval(() => {
            setDiceTimer(prev => { if (prev <= 1) { handleUserRollDice(); return 0; } return prev - 1; });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [showDiceModal, diceRolls, isDiceRolling]);

      useEffect(() => {
        let interval = null;
        if (showDiceModal && diceRolls && !isDiceRolling) {
          interval = setInterval(() => {
            setResultTimer(prev => { if (prev <= 1) { startRoundAfterDice(); return 0; } return prev - 1; });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [showDiceModal, diceRolls, isDiceRolling]);

      useEffect(() => {
        let interval = null;
        if (screen === 'game' && phase === 'bidding' && !showDiceModal && !roundSummary && !victoryData && !showExitConfirm) {
          interval = setInterval(() => {
            setBiddingTimer(prev => { if (prev <= 1) { handleHumanBid(0); return 20; } return prev - 1; });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [screen, phase, showDiceModal, roundSummary, victoryData, showExitConfirm]);

      useEffect(() => {
        let interval = null;
        if (screen === 'game' && phase === 'playing' && turn === 0 && !isEvaluatingRef.current && !animatingCardId && !collectingWinnerId && playedCards.length < players.length && !showDiceModal && !roundSummary && !victoryData && !showExitConfirm) {
          interval = setInterval(() => {
            setTurnTimer(prev => {
              if (prev <= 1) { if (players[0]?.hand?.length > 0) { playCard(0, 0); } return 20; }
              return prev - 1;
            });
          }, 1000);
        } else {
          setTurnTimer(20);
        }
        return () => clearInterval(interval);
      }, [screen, phase, turn, playedCards, animatingCardId, collectingWinnerId, players, showDiceModal, roundSummary, victoryData, showExitConfirm]);

      useEffect(() => {
        const interval = setInterval(() => {
          const { screen: s, phase: p, turn: t, players: pl, playedCards: pc, animatingCardId: anim, collectingWinnerId: coll } = stateRef.current;
          if (s === 'game' && p === 'playing' && t !== 0 && !isEvaluatingRef.current && !anim && !coll && !isProcessingClickRef.current && pc.length < pl.length && !showExitConfirm) {
            const currentKi = pl[t];
            if (currentKi && currentKi.hand.length > 0) { playCard(t, 0); }
          }
        }, 1200);
        return () => clearInterval(interval);
      }, [showExitConfirm]);

      useEffect(() => {
        let interval = null;
        if (roundSummary && !showExitConfirm) {
          interval = setInterval(() => {
            setSummaryTimer(prev => { if (prev <= 1) { proceedToNextRound(); return 0; } return prev - 1; });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [roundSummary, showExitConfirm]);

      useEffect(() => {
        let interval = null;
        if (victoryData && !showExitConfirm) {
          interval = setInterval(() => {
            setVictoryTimer(prev => { if (prev <= 1) { finishGameAndGoMenu(); return 0; } return prev - 1; });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [victoryData, showExitConfirm]);

      const startNewGame = () => {
        handleUserInteraction();
        const shuffledNames = shuffleArray(FAMOUS_WIZARDS);
        const suitKeys = Object.keys(SUITS);

        const initialPlayers = [
          { 
            id: 0, 
            name: profile.name, 
            avatarObj: profile.selectedAvatar, 
            isHuman: true, 
            bid: null, 
            tricks: 0, 
            score: 0, 
            hand: [] 
          }
        ];

        for (let i = 1; i < playerCount; i++) {
          const randomSuit = suitKeys[Math.floor(Math.random() * suitKeys.length)];
          const avatarTypes = ['jester', 'number', 'wizard'];
          const chosenType = avatarTypes[Math.floor(Math.random() * avatarTypes.length)];
          
          let randomAvatarObj;
          if (chosenType === 'jester') {
            randomAvatarObj = { type: 'jester', suit: randomSuit };
          } else if (chosenType === 'wizard') {
            randomAvatarObj = { type: 'wizard', wizardIndex: Math.floor(Math.random() * 4) };
          } else {
            const randomVal = Math.floor(Math.random() * 13) + 1;
            randomAvatarObj = { 
              type: 'number', 
              value: randomVal, 
              suit: (randomVal >= 1 && randomVal <= 13 && randomSuit === 'yellow') ? 'yellow' : randomSuit 
            };
          }

          initialPlayers.push({
            id: i,
            name: `${shuffledNames[i - 1]} (KI)`,
            avatarObj: randomAvatarObj,
            isHuman: false,
            bid: null,
            tricks: 0,
            score: 0,
            hand: []
          });
        }
        setPlayers(initialPlayers);
        setScreen('game');
        setShowExitConfirm(false);

        setShowDiceModal(true);
        setDiceRolls(null);
        setDiceWinner(null);
        setIsDiceRolling(false);
        setDiceTimer(20);
        setResultTimer(10);
      };

      const handleUserRollDice = () => {
        if (isDiceRolling || diceRolls) return;
        setIsDiceRolling(true);

        setTimeout(() => {
          const rolls = players.map(() => getCryptoRandomDice());
          let maxRoll = -1;
          let winnerIdx = 0;
          rolls.forEach((val, idx) => { if (val > maxRoll) { maxRoll = val; winnerIdx = idx; } });
          setDiceRolls(rolls);
          setDiceWinner(winnerIdx);
          setIsDiceRolling(false);
          setResultTimer(10);
        }, 800);
      };

      const handleDiceOverlayClick = (e) => {
        e.stopPropagation();
        handleUserInteraction();
        if (!diceRolls && !isDiceRolling) { handleUserRollDice(); } 
        else if (diceRolls && !isDiceRolling) { startRoundAfterDice(); }
      };

      const startRoundAfterDice = () => {
        setShowDiceModal(false);
        startRound(1, players, diceWinner !== null ? diceWinner : 0);
      };

      const startRound = (rNum, currentPlayers, startingPlayerIdx) => {
        setRound(rNum);
        setPhase('bidding');
        setPlayedCards([]);
        setTurn(startingPlayerIdx);
        setAnimatingCardId(null);
        setAnimatingCardObj(null);
        setCollectingWinnerId(null);
        isEvaluatingRef.current = false;
        isProcessingClickRef.current = false;
        setBiddingTimer(20);
        setTurnTimer(20);

        let rawDeck = [];
        const suits = ['yellow', 'red', 'green', 'blue'];
        const roundSeed = Date.now();

        suits.forEach(s => {
          for(let v = 1; v <= 13; v++) {
            rawDeck.push({ type: 'number', value: v, suit: s, id: `${s}_${v}_${roundSeed}_${Math.random()}` });
          }
        });
        
        for(let i=0; i<4; i++) {
          rawDeck.push({ type: 'wizard', wizardIndex: i, id: `w_${i}_${roundSeed}_${Math.random()}` });
        }
        
        for(let i=0; i<4; i++) {
          const jSuit = i === 0 ? 'blue' : i === 1 ? 'red' : i === 2 ? 'yellow' : 'green';
          rawDeck.push({ type: 'jester', suit: jSuit, id: `j_${i}_${roundSeed}_${Math.random()}` });
        }

        let deck = shuffleArray(rawDeck);

        const newPlayers = currentPlayers.map(p => {
          const hand = deck.splice(0, rNum);
          return { ...p, hand, bid: null, tricks: 0 };
        });

        const trump = deck.length > 0 ? deck[0] : null;

        newPlayers.forEach(p => {
          if (!p.isHuman) {
            let kiBid = 0;
            p.hand.forEach(c => { if (c.type === 'wizard' || (c.type === 'number' && c.value > 10)) kiBid++; });
            p.bid = Math.min(kiBid, rNum);
          }
        });

        setTrumpCard(trump);
        setPlayers(newPlayers);
      };

      const handleHumanBid = (bidVal) => {
        handleUserInteraction();
        setPlayers(prev => prev.map(p => p.isHuman ? { ...p, bid: bidVal } : p));
        setPhase('playing');
        setTurnTimer(20);
      };

      const playCard = (playerIdx, cardIdx) => {
        if (isEvaluatingRef.current || isProcessingClickRef.current || animatingCardId || collectingWinnerId) return;
        handleUserInteraction();
        const currentPlayers = stateRef.current.players;
        const currentPlayed = stateRef.current.playedCards;
        const p = currentPlayers[playerIdx];
        if (!p || !p.hand[cardIdx]) return;

        const selectedCard = p.hand[cardIdx];
        const alreadyPlayed = currentPlayed.some(pc => pc.card.id && pc.card.id === selectedCard.id);
        if (alreadyPlayed) return;

        isProcessingClickRef.current = true;
        const newHand = p.hand.filter((_, i) => i !== cardIdx);
        
        setAnimatingCardId(selectedCard.id);
        setAnimatingCardObj(selectedCard);

        setPlayers(prev => prev.map(pl => pl.id === p.id ? { ...pl, hand: newHand } : pl));

        setTimeout(() => {
          const newPlayed = [...currentPlayed, { playerId: p.id, card: selectedCard }];
          setPlayedCards(newPlayed);
          setAnimatingCardId(null);
          setAnimatingCardObj(null);

          if (newPlayed.length === currentPlayers.length) {
            isEvaluatingRef.current = true;
            evaluateTrick(newPlayed);
          } else {
            setTurn((playerIdx + 1) % currentPlayers.length);
            setTurnTimer(20);
          }
          isProcessingClickRef.current = false;
        }, 750);
      };

      const evaluateTrick = (cardsOnTable) => {
        let winningCardObj = cardsOnTable[0];
        const activeTrump = stateRef.current.trumpCard;

        const firstWizard = cardsOnTable.find(c => c.card.type === 'wizard');
        if (firstWizard) {
          winningCardObj = firstWizard;
        } else {
          const allJesters = cardsOnTable.every(c => c.card.type === 'jester');
          if (allJesters) {
            winningCardObj = cardsOnTable[0];
          } else {
            const trumpSuit = (activeTrump && activeTrump.type === 'number') ? activeTrump.suit : null;
            const leadCardObj = cardsOnTable.find(c => c.card.type === 'number');
            const leadSuit = leadCardObj ? leadCardObj.card.suit : null;

            let bestRank = -1;

            cardsOnTable.forEach(c => {
              const card = c.card;
              if (card.type === 'number') {
                let currentRank = -1;

                if (trumpSuit && card.suit === trumpSuit) {
                  currentRank = 2000 + card.value;
                } else if (leadSuit && card.suit === leadSuit) {
                  currentRank = 1000 + card.value;
                } else {
                  currentRank = card.value;
                }

                if (currentRank > bestRank) {
                  bestRank = currentRank;
                  winningCardObj = c;
                }
              }
            });
          }
        }

        const winnerId = winningCardObj.playerId;
        setCollectingWinnerId(winnerId);

        setTimeout(() => {
          setPlayers(prev => {
            const updated = prev.map(p => p.id === winnerId ? { ...p, tricks: p.tricks + 1 } : p);
            setPlayedCards([]);
            setCollectingWinnerId(null);
            isEvaluatingRef.current = false;
            isProcessingClickRef.current = false;

            const human = updated[0];
            if (human.hand.length === 0) {
              setTimeout(() => handleRoundEnd(updated, stateRef.current.round), 400);
            } else {
              setTurn(winnerId);
              setTurnTimer(20);
            }
            return updated;
          });
        }, 850);
      };

      const handleRoundEnd = (currentPlayers, currentRoundNum) => {
        let bestGuessers = [];
        let minDiff = 999;

        const calculated = currentPlayers.map(p => {
          const diff = Math.abs(p.bid - p.tricks);
          let pointsGained = (diff === 0) ? (20 + (p.tricks * 10)) : -(diff * 10);
          if (diff < minDiff) { minDiff = diff; bestGuessers = [p.id]; }
          else if (diff === minDiff) { bestGuessers.push(p.id); }
          return { ...p, score: p.score + pointsGained, pointsGained };
        });

        const nextRoundStarter = bestGuessers[Math.floor(Math.random() * bestGuessers.length)];
        setRoundSummary({ round: currentRoundNum, calculatedPlayers: calculated, nextStarterId: nextRoundStarter });
        setSummaryTimer(10);
      };

      const proceedToNextRound = () => {
        if (!roundSummary) return;
        const updated = roundSummary.calculatedPlayers;
        const nextStarter = roundSummary.nextStarterId;
        const nextR = roundSummary.round + 1;

        setPlayers(updated);
        setRoundSummary(null);

        if (nextR <= maxRounds) {
          startRound(nextR, updated, nextStarter);
        } else {
          const sortedFinal = [...updated].sort((a, b) => b.score - a.score);
          setVictoryData(sortedFinal);
          setVictoryTimer(20);

          const isHumanWinner = sortedFinal[0].isHuman;
          const activeSuit = profile.activeSuit || 'yellow';
          let earnedXp = isHumanWinner ? 150 : 50;

          const currentSuitData = profile.elementLevels[activeSuit] || { level: 1, xp: 0 };
          let newSuitXp = currentSuitData.xp + earnedXp;
          let newSuitLevel = currentSuitData.level;
          let xpNeededSuit = getXpNeededForElementLevel(newSuitLevel);
          while (newSuitLevel < 15 && newSuitXp >= xpNeededSuit) {
            newSuitXp -= xpNeededSuit;
            newSuitLevel += 1;
            xpNeededSuit = getXpNeededForElementLevel(newSuitLevel);
          }
          if (newSuitLevel >= 15) {
            newSuitLevel = 15;
            newSuitXp = Math.min(newSuitXp, xpNeededSuit);
          }
          const updatedElementLevels = {
            ...profile.elementLevels,
            [activeSuit]: { level: newSuitLevel, xp: newSuitXp }
          };

          let globalLevel = profile.level || 1;
          let globalXp = (profile.xp || 0) + earnedXp;

          let xpNeededGlobal = getXpNeededForGlobalLevel(globalLevel);
          while (globalLevel < 999 && globalXp >= xpNeededGlobal) {
            globalXp -= xpNeededGlobal;
            globalLevel += 1;
            xpNeededGlobal = getXpNeededForGlobalLevel(globalLevel);
          }
          if (globalLevel >= 999) {
            globalLevel = 999;
            globalXp = Math.min(globalXp, xpNeededGlobal);
          }

          const updatedProfile = { 
            ...profile, 
            offlinePlayed: (profile.offlinePlayed || 0) + 1, 
            offlineWins: isHumanWinner ? (profile.offlineWins || 0) + 1 : (profile.offlineWins || 0),
            level: globalLevel,
            xp: globalXp,
            elementLevels: updatedElementLevels
          };
          setProfile(updatedProfile);
          localStorage.setItem('wizard_profile', JSON.stringify(updatedProfile));
        }
      };

      const finishGameAndGoMenu = () => {
        setVictoryData(null);
        setShowExitConfirm(false);
        setScreen('menu');
      };

      // ---------------- EINSTELLUNGEN ----------------
      if (screen === 'settings') {
        return (
          <div onClick={handleUserInteraction} className="flex flex-col h-full max-w-md mx-auto p-4 justify-between bg-slate-950 overflow-y-auto">
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-bold text-sky-400">Einstellungen</h2>
              <button onClick={() => setScreen('menu')} className="text-xs bg-slate-800 text-sky-300 px-3 py-1.5 rounded-lg font-bold">Zurück</button>
            </div>

            <div className="space-y-4 my-auto">
              <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-xl">
                <div className="space-y-1">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold text-slate-300">Musik-Lautstärke</span>
                    <span className="text-xs font-black text-amber-400">{Math.round(musicVolume * 100)}%</span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="1"
                    step="0.05"
                    value={musicVolume}
                    onChange={(e) => handleVolumeChange(parseFloat(e.target.value))}
                    className="w-full accent-sky-400 bg-slate-950 rounded-lg h-2 cursor-pointer"
                  />
                </div>
              </div>
            </div>

            <button onClick={() => setScreen('menu')} className="w-full py-3 mythic-btn-primary text-white font-bold rounded-xl">Zurück zum Menü</button>
          </div>
        );
      }

      // ---------------- 2. EINZELSPIEL EINSTELLUNGEN ----------------
      if (screen === 'game_setup') {
        return (
          <div className="flex flex-col landscape:flex-row h-full max-w-4xl mx-auto bg-slate-950 justify-between overflow-hidden">
            <div className="w-full h-24 landscape:h-full landscape:w-1/2 relative overflow-hidden border-b landscape:border-b-0 landscape:border-r border-sky-500/30 shadow-2xl shrink-0 flex items-center justify-center">
              <img src="./1791640481183.jpg" alt="Mythos Header" className="w-full h-full object-cover" />
            </div>

            <div className="p-4 flex-1 flex flex-col gap-3 overflow-y-auto">
              <div className="flex justify-between items-center mb-1">
                <h2 className="text-lg font-black text-sky-300">Einzelspiel</h2>
                <button onClick={() => setScreen('menu')} className="text-xs bg-slate-900 border border-slate-800 text-sky-300 px-3 py-1.5 rounded-lg font-bold">Zurück</button>
              </div>

              <div className="mythic-card p-3 rounded-2xl flex flex-col gap-3">
                <div>
                  <label className="text-[11px] font-bold text-sky-200 block mb-1">Gegner / Spieleranzahl:</label>
                  <div className="grid grid-cols-4 gap-2">
                    {[3, 4, 5, 6].map(num => (
                      <button
                        key={num}
                        onClick={() => setPlayerCount(num)}
                        className={`py-2 rounded-xl font-extrabold text-sm crystal-btn ${playerCount === num ? 'crystal-active text-white' : 'bg-slate-900 text-slate-400'}`}
                      >
                        {num}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-bold text-sky-200 block mb-1">Rundenanzahl:</label>
                  <div className="grid grid-cols-3 gap-2">
                    {[5, 10, 15].map(num => (
                      <button
                        key={num}
                        onClick={() => setMaxRounds(num)}
                        className={`py-2 rounded-xl font-bold text-xs crystal-btn ${maxRounds === num ? 'crystal-active text-white' : 'bg-slate-900 text-slate-400'}`}
                      >
                        {num} R.
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-bold text-sky-200 block mb-1">KI-Schwierigkeit:</label>
                  <div className="grid grid-cols-3 gap-2">
                    {['Leicht', 'Normal', 'Magisch'].map(diff => (
                      <button
                        key={diff}
                        onClick={() => setDifficulty(diff)}
                        className={`py-2 rounded-xl font-bold text-xs crystal-btn ${difficulty === diff ? 'crystal-active text-white' : 'bg-slate-900 text-slate-400'}`}
                      >
                        {diff}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <button
                onClick={startNewGame}
                className="w-full py-3.5 rounded-2xl mythic-btn-primary text-white font-black text-base active:scale-95 transition-transform shrink-0 shadow-2xl"
              >
                Duell beginnen
              </button>
            </div>
          </div>
        );
      }

      // ---------------- 3. PROFIL & STATISTIKEN ----------------
      if (screen === 'profile') {
        const offPlayed = profile.offlinePlayed || 0;
        const offWins = profile.offlineWins || 0;
        const offLosses = Math.max(0, offPlayed - offWins);
        const offWinrate = offPlayed > 0 ? Math.round((offWins / offPlayed) * 100) : 0;

        const onPlayed = profile.onlinePlayed || 0;
        const onWins = profile.onlineWins || 0;
        const onLosses = Math.max(0, onPlayed - onWins);
        const onWinrate = onPlayed > 0 ? Math.round((onWins / onPlayed) * 100) : 0;

        const activeSuitKey = profile.activeSuit || 'yellow';
        
        const globalLevel = profile.level || 1;
        const globalXp = profile.xp || 0;
        const xpNeededForNextGlobal = getXpNeededForGlobalLevel(globalLevel);
        const xpProgressPercent = globalLevel >= 999 ? 100 : Math.min(100, Math.round((globalXp / xpNeededForNextGlobal) * 100));

        const activeElementData = profile.elementLevels?.[activeSuitKey] || { level: 1, xp: 0 };
        const elementLevel = activeElementData.level;
        const elementXp = activeElementData.xp;
        const xpNeededForNextElement = getXpNeededForElementLevel(elementLevel);
        const elementXpPercent = elementLevel >= 15 ? 100 : Math.min(100, Math.round((elementXp / xpNeededForNextElement) * 100));

        return (
          <div onClick={handleUserInteraction} className="flex flex-col h-full max-w-md mx-auto p-4 justify-between bg-slate-950 overflow-y-auto">
            <div className="flex justify-between items-center mb-2">
              <h2 className="text-xl font-black text-sky-300">Spielerprofil</h2>
              <button onClick={() => setScreen('menu')} className="text-xs bg-slate-900 border border-slate-800 text-sky-300 px-3 py-1.5 rounded-lg font-bold">Zurück</button>
            </div>

            {showAvatarModal && (
              <div className="absolute inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col p-4 overflow-y-auto">
                <div className="flex justify-between items-center mb-3 border-b border-sky-500/30 pb-2">
                  <h3 className="font-black text-sky-300 text-sm">Avatar & Element wählen</h3>
                  <button onClick={() => setShowAvatarModal(false)} className="text-xs bg-slate-800 text-sky-300 px-3 py-1 rounded-lg font-bold">Fertig</button>
                </div>

                <div className="space-y-4 pb-4">
                  <div className="text-[11px] text-slate-400">
                    Wähle dein aktives Element. Jedes gewonnene Spiel levelt dein gewähltes Element auf!
                  </div>

                  <div className="grid grid-cols-4 gap-2">
                    {Object.values(SUITS).map(s => {
                      const isSelected = profile.activeSuit === s.key;
                      const lvl = profile.elementLevels?.[s.key]?.level || 1;
                      return (
                        <button
                          key={s.key}
                          onClick={() => {
                            const updated = { ...profile, activeSuit: s.key };
                            setProfile(updated);
                            localStorage.setItem('wizard_profile', JSON.stringify(updated));
                          }}
                          className={`p-2.5 rounded-xl border flex flex-col items-center gap-1 text-xs font-bold transition-all ${isSelected ? 'border-sky-400 bg-sky-950 text-sky-200 shadow-lg' : 'border-slate-800 bg-slate-900 text-slate-400'}`}
                        >
                          <span className="truncate">{s.name}</span>
                          <span className="text-amber-400 text-[10px]">Lvl {lvl}</span>
                        </button>
                      );
                    })}
                  </div>

                  <div className="bg-slate-900/80 border border-slate-800 p-3 rounded-2xl space-y-2">
                    <div className="text-xs font-bold text-sky-300 flex justify-between items-center">
                      <span>Pfad für: {SUITS[activeSuitKey]?.title || 'WIND'}</span>
                      <span className="text-[10px] text-amber-300">Level {elementLevel} / 15</span>
                    </div>

                    <div className="bg-slate-950 border border-slate-800 p-2 rounded-xl space-y-1">
                      <div className="flex justify-between text-[10px] text-slate-400 font-bold">
                        <span>Element-XP ({SUITS[activeSuitKey]?.name || 'Gelb'})</span>
                        <span className="text-amber-400">{elementLevel >= 15 ? 'MAX' : `${elementXp} / ${xpNeededForNextElement} XP`}</span>
                      </div>
                      <div className="w-full h-2 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
                        <div className="h-full bg-gradient-to-r from-emerald-500 to-sky-400 transition-all duration-500" style={{ width: `${elementXpPercent}%` }}></div>
                      </div>
                    </div>

                    <div className="grid grid-cols-4 gap-2 max-h-56 overflow-y-auto p-1">
                      {getAvailableAvatarsForSuit(activeSuitKey, elementLevel).map((av, idx) => {
                        const isCurrentActive = profile.selectedAvatar?.type === av.type && profile.selectedAvatar?.suit === av.suit && profile.selectedAvatar?.wizardIndex === av.wizardIndex && profile.selectedAvatar?.value === av.value;
                        return (
                          <div 
                            key={idx}
                            onClick={() => {
                              if (av.unlocked) {
                                const updated = { ...profile, selectedAvatar: av };
                                setProfile(updated);
                                localStorage.setItem('wizard_profile', JSON.stringify(updated));
                              }
                            }}
                            className={`p-2 rounded-xl border flex flex-col items-center justify-center gap-1 relative transition-all aspect-square ${av.unlocked ? 'cursor-pointer hover:border-sky-400' : 'opacity-40 cursor-not-allowed'} ${isCurrentActive ? 'border-amber-400 bg-amber-950/40 shadow-lg' : 'border-slate-800 bg-slate-950'}`}
                          >
                            <div className="scale-90 origin-center flex items-center justify-center w-full h-full">
                              {renderAvatarIcon(av, "w-12 h-12 text-base")}
                            </div>
                            {!av.unlocked && (
                              <span className="absolute inset-0 bg-black/60 rounded-xl flex items-center justify-center text-xs font-black text-amber-400">
                                LCK
                              </span>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            )}

            <div className="mythic-card p-4 rounded-2xl flex flex-col gap-3 my-auto items-center text-center shadow-2xl">
              <div className="relative group cursor-pointer" onClick={() => setShowAvatarModal(true)}>
                {renderAvatarIcon(profile.selectedAvatar, "w-20 h-20 text-3xl")}
                <div className="absolute inset-0 rounded-full bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity text-[10px] font-bold text-sky-200">
                  Ändern
                </div>
              </div>

              <div className="w-full flex flex-col items-center">
                {!isEditingName ? (
                  <div className="flex items-center gap-2">
                    <h3 className="text-lg font-black text-sky-200">{profile.name}</h3>
                    <button 
                      onClick={() => { setIsEditingName(true); setNameInput(profile.name); setNameError(''); }}
                      className="text-xs text-sky-400 bg-slate-900 border border-sky-500/30 px-2 py-0.5 rounded-lg font-bold"
                    >
                      Bearbeiten
                    </button>
                  </div>
                ) : (
                  <div className="w-full flex flex-col gap-2">
                    <input
                      type="text"
                      value={nameInput}
                      onChange={(e) => { setNameInput(e.target.value); setNameError(''); }}
                      placeholder="Dein Name..."
                      maxLength={16}
                      className="w-full bg-slate-900 border border-sky-400 text-sky-100 p-2 rounded-xl text-center font-bold text-sm focus:outline-none"
                    />
                    {nameError && <span className="text-[10px] text-red-400 font-bold">{nameError}</span>}
                    <div className="flex gap-2">
                      <button onClick={handleSaveName} className="flex-1 py-1.5 mythic-btn-primary text-white text-xs font-bold rounded-lg">Speichern</button>
                      <button onClick={() => { setIsEditingName(false); setNameError(''); }} className="flex-1 py-1.5 bg-slate-800 text-slate-300 text-xs font-bold rounded-lg">Abbrechen</button>
                    </div>
                  </div>
                )}
                
                <span className="text-xs font-bold text-amber-400 mt-0.5">Level {globalLevel}</span>
                
                <div className="w-full bg-slate-900 border border-slate-800 p-2 rounded-xl mt-2 text-left space-y-1">
                  <div className="flex justify-between text-[10px] text-slate-400 font-bold">
                    <span>Gesamt-XP</span>
                    <span className="text-amber-400">{globalLevel >= 999 ? 'MAX' : `${globalXp} / ${xpNeededForNextGlobal} XP`}</span>
                  </div>
                  <div className="w-full h-2 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
                    <div className="h-full bg-gradient-to-r from-amber-500 to-sky-400 transition-all duration-500" style={{ width: `${xpProgressPercent}%` }}></div>
                  </div>
                </div>
              </div>

              <div className="w-full bg-slate-900/90 border border-slate-800 p-3 rounded-xl text-left space-y-1.5 text-xs shadow-inner">
                <div className="font-extrabold text-sky-300 border-b border-slate-800 pb-1 flex justify-between items-center">
                  <span>Offline-Duelle (KI)</span>
                  <span className="text-[10px] text-slate-400 font-normal">Siegquote: {offWinrate}%</span>
                </div>
                <div className="flex justify-between"><span className="text-slate-400">Gespielte Matches:</span><span className="font-bold text-sky-200">{offPlayed}</span></div>
                <div className="flex justify-between"><span className="text-slate-400">Siege:</span><span className="font-bold text-emerald-400">{offWins}</span></div>
                <div className="flex justify-between"><span className="text-slate-400">Niederlagen:</span><span className="font-bold text-red-400">{offLosses}</span></div>
              </div>

              <div className="w-full bg-purple-950/30 border border-purple-500/20 p-3 rounded-xl text-left space-y-1.5 text-xs shadow-inner">
                <div className="font-extrabold text-purple-300 border-b border-purple-500/20 pb-1 flex justify-between items-center">
                  <span>Online-Duelle</span>
                  <span className="text-[10px] text-purple-400 font-normal">Siegquote: {onWinrate}%</span>
                </div>
                <div className="flex justify-between"><span className="text-slate-400">Gespielte Matches:</span><span className="font-bold text-purple-200">{onPlayed}</span></div>
                <div className="flex justify-between"><span className="text-slate-400">Siege:</span><span className="font-bold text-emerald-400">{onWins}</span></div>
                <div className="flex justify-between"><span className="text-slate-400">Niederlagen:</span><span className="font-bold text-red-400">{onLosses}</span></div>
              </div>
            </div>

            <button onClick={() => setScreen('menu')} className="w-full py-3 mythic-btn-primary text-white font-bold rounded-xl mt-2">Zurück zum Hauptmenü</button>
          </div>
        );
      }

      // ---------------- 4. ONLINE-LOBBY ----------------
      if (screen === 'multiplayer') {
        return (
          <div onClick={handleUserInteraction} className="flex flex-col h-full max-w-md mx-auto p-4 justify-between bg-slate-950 overflow-y-auto">
            <div className="flex justify-between items-center mb-2">
              <h2 className="text-xl font-black text-sky-300">Online-Lobby</h2>
              <button onClick={() => setScreen('menu')} className="text-xs bg-slate-900 border border-slate-800 text-sky-300 px-3 py-1.5 rounded-lg font-bold">Zurück</button>
            </div>

            <div className="mythic-card p-5 rounded-2xl text-center space-y-4 my-auto">
              <h3 className="font-bold text-sky-200 text-sm">Multiplayer-Schnittstelle</h3>
              <p className="text-xs text-slate-400 leading-relaxed">Hier wirst du dich bald mit Freunden verbinden oder offene Räume suchen können.</p>
            </div>

            <button onClick={() => setScreen('menu')} className="w-full py-3 mythic-btn-primary text-white font-bold rounded-xl">Zurück zum Menü</button>
          </div>
        );
      }

      // ---------------- 5. REGELN ----------------
      if (screen === 'rules') {
        return (
          <div onClick={handleUserInteraction} className="flex flex-col h-full max-w-md mx-auto p-4 justify-between bg-slate-950 overflow-y-auto">
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-bold text-sky-400">Spielregeln</h2>
              <button onClick={() => setScreen('menu')} className="text-xs bg-slate-800 text-sky-300 px-3 py-1.5 rounded-lg font-bold">Zurück</button>
            </div>

            <div className="space-y-3 text-xs text-slate-300 leading-relaxed pb-4">
              <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-1">
                <h3 className="font-bold text-sky-300 text-sm">1. Das Grundprinzip & Rundenablauf</h3>
                <p>In jeder Runde erhält jeder Spieler eine bestimmte Anzahl an Karten (beginnend bei 1 Karte in Runde 1). Vor jedem Stich sagst du exakt voraus, wie viele Stiche du in dieser Runde gewinnen wirst. Das Ziel ist es, diese Ansage Punkt genau zu treffen.</p>
              </div>

              <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-1">
                <h3 className="font-bold text-sky-300 text-sm">2. Die Stich-Hierarchie</h3>
                <p>Zauberer sind die mächtigsten Karten im Spiel und stechen alles. Der allererste ausgespielte Zauberer gewinnt den Stich bedingungslos. Narren sind die schwächsten Karten und verlieren immer, es sei denn, es werden ausschließlich Narren in einem Stich ausgespielt (dann gewinnt der erste Narr).</p>
              </div>

              <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-1">
                <h3 className="font-bold text-sky-300 text-sm">3. Farbzwang & Trumpf</h3>
                <p>Es herrscht Farbzwang: Du musst die ausgespielte Leitfarbe bedienen, sofern du sie auf der Hand hast. Kannst du nicht bekennen, darfst du eine andere Farbe oder einen Trumpf spielen. Die aufgedeckte Trumpfkarte sticht jede Fehlfarbe. Innerhalb der Farbe oder des Trumpfs entscheidet die höhere Zahl.</p>
              </div>

              <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-1">
                <h3 className="font-bold text-sky-300 text-sm">4. Wertung & Punkte</h3>
                <p>Triffst du deine Ansage exakt, erhältst du 20 Basispunkte plus 10 Punkte für jeden gewonnenen Stich. Liegst du daneben (zu viele oder zu wenige Stiche), gibt es Minuspunkte entsprechend der Differenz zu deiner Ansage.</p>
              </div>
            </div>

            <button onClick={() => setScreen('menu')} className="w-full py-3 mythic-btn-primary text-white font-bold rounded-xl">Zurück zum Menü</button>
          </div>
        );
      }

      // ---------------- 6. SPIELFELD ----------------
      const humanPlayer = players[0] || {};
      const isHumanTurn = (turn === 0);

      return (
        <div onClick={handleUserInteraction} className="flex flex-col h-full max-w-md mx-auto p-2 justify-between bg-slate-950 relative overflow-hidden">
          
          {showExitConfirm && (
            <div className="absolute inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 text-center select-none overflow-y-auto">
              <div className="w-full max-w-xs mythic-card p-5 rounded-3xl flex flex-col items-center gap-4 my-auto shadow-2xl border border-sky-500/40">
                <div className="space-y-1">
                  <h3 className="text-base font-black text-sky-200">Duell wirklich abbrechen?</h3>
                  <p className="text-xs text-slate-400 leading-relaxed">Dein aktueller Fortschritt in dieser Partie geht dabei verloren.</p>
                </div>

                <div className="flex gap-2 w-full pt-2">
                  <button onClick={finishGameAndGoMenu} className="flex-1 py-3 bg-red-950/80 hover:bg-red-900 border border-red-500/50 text-red-200 font-black text-xs rounded-xl active:scale-95 transition-transform shadow-lg">Ja, beenden</button>
                  <button onClick={() => setShowExitConfirm(false)} className="flex-1 py-3 mythic-btn-primary text-white font-black text-xs rounded-xl active:scale-95 transition-transform shadow-lg">Nein, weiter</button>
                </div>
              </div>
            </div>
          )}

          {showDiceModal && !showExitConfirm && (
            <div onClick={handleDiceOverlayClick} className="absolute inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 text-center cursor-pointer select-none overflow-y-auto">
              <div className="w-full max-w-xs flex flex-col items-center gap-3 my-auto">
                <div>
                  <h2 className="text-xl font-black text-sky-300">Duell-Eröffnung</h2>
                  <p className="text-xs text-slate-400 mt-0.5">Wer schlägt das erste Kapitel auf?</p>
                </div>

                <div className={`w-24 h-24 rounded-3xl bg-gradient-to-b from-sky-500 to-sky-800 border-2 border-sky-300 shadow-2xl flex items-center justify-center text-3xl font-black my-1 transition-transform ${isDiceRolling ? 'animate-dice-active' : 'shadow-sky-500/30'}`}>
                  {isDiceRolling ? '...' : diceRolls ? diceRolls[0] : '?'}
                </div>

                {!diceRolls && !isDiceRolling && (
                  <div className="flex flex-col items-center gap-1">
                    <span className="text-xs font-black text-amber-400 animate-pulse">Tippe auf den Bildschirm zum Würfeln</span>
                    <span className="text-[11px] text-sky-400 font-extrabold bg-sky-950 px-3 py-1 rounded-full border border-sky-500/30">Auto-Würfeln in {diceTimer}s</span>
                  </div>
                )}

                {diceRolls && (
                  <div className="w-full bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-2 text-xs shadow-2xl animate-fadeIn">
                    <div className="font-bold text-sky-300 border-b border-slate-800 pb-1 text-xs">Augenzahlen aller Spieler:</div>
                    <div className="grid grid-cols-2 gap-2">
                      {players.map((p, idx) => (
                        <div key={p.id} className={`p-1.5 rounded-xl flex justify-between items-center ${diceWinner === idx ? 'bg-sky-950 border border-sky-400 text-sky-200' : 'bg-slate-950/60 text-slate-400'}`}>
                          <span className="font-bold truncate text-xs">{p.name}:</span>
                          <span className="font-black text-amber-400 text-xs">{diceRolls[idx]}</span>
                        </div>
                      ))}
                    </div>

                    <div className="bg-emerald-950/80 border border-emerald-500/50 p-2 rounded-xl text-center text-xs text-emerald-300 mt-2 font-bold">
                      {players[diceWinner]?.name} gewinnt und beginnt Runde 1!
                    </div>

                    <div className="pt-2 flex flex-col items-center gap-1 border-t border-slate-800 mt-2">
                      <button onClick={(e) => { e.stopPropagation(); startRoundAfterDice(); }} className="w-full py-3 mythic-btn-primary text-white font-black text-xs rounded-xl shadow-2xl active:scale-95 transition-transform flex items-center justify-center gap-2">
                        <span>Weiter zum Spiel</span>
                        <span className="bg-sky-950/80 border border-sky-400/60 px-2 py-0.5 rounded-md text-[11px] font-bold text-amber-300">{resultTimer}s</span>
                      </button>
                      <span className="text-[10px] text-slate-400 font-bold">Automatisch weiter in {resultTimer} Sekunden</span>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {roundSummary && !showExitConfirm && (
            <div onClick={proceedToNextRound} className="absolute inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 cursor-pointer select-none overflow-y-auto">
              <div className="w-full max-w-xs flex flex-col items-center gap-3 my-auto">
                <h2 className="text-xl font-black text-sky-300">Ergebnis Runde {roundSummary.round}</h2>
                <div className="w-full space-y-2">
                  {roundSummary.calculatedPlayers.map(p => (
                    <div key={p.id} className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center text-xs">
                      <div>
                        <div className="font-bold text-sky-200">{p.name}</div>
                        <div className="text-[10px] text-slate-400">Stiche: {p.tricks} (Ansage: {p.bid})</div>
                      </div>
                      <div className="text-right">
                        <div className={`font-extrabold ${p.pointsGained >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                          {p.pointsGained >= 0 ? `+${p.pointsGained}` : p.pointsGained} Ptn
                        </div>
                        <div className="text-[10px] font-bold text-amber-300">Gesamt: {p.score}</div>
                      </div>
                    </div>
                  ))}

                  <div className="bg-sky-950/80 border border-sky-400/50 p-3 rounded-2xl text-center text-xs text-sky-200 mt-3 font-bold space-y-2.5 shadow-2xl">
                    <div>{roundSummary.calculatedPlayers.find(p => p.id === roundSummary.nextStarterId)?.name} beginnt Runde {roundSummary.round + 1}!</div>
                    <div className="pt-2 border-t border-sky-500/30 flex flex-col items-center gap-1">
                      <button onClick={(e) => { e.stopPropagation(); proceedToNextRound(); }} className="w-full py-2.5 mythic-btn-primary text-white font-black text-xs rounded-xl shadow-xl active:scale-95 transition-transform flex items-center justify-center gap-2">
                        <span>Nächste Runde starten</span>
                        <span className="bg-sky-950/90 border border-sky-400/60 px-2 py-0.5 rounded-md text-[11px] font-bold text-amber-300">{summaryTimer}s</span>
                      </button>
                      <span className="text-[10px] text-slate-400 font-bold">Automatisch weiter in {summaryTimer} Sekunden</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {victoryData && !showExitConfirm && (() => {
            const winner = victoryData[0] || {};
            const winnerAvatar = winner.avatarObj || profile.selectedAvatar;
            const winnerSuitKey = winnerAvatar?.suit || 'yellow';
            const suitTheme = SUITS[winnerSuitKey] || SUITS.yellow;

            return (
              <div onClick={finishGameAndGoMenu} className="absolute inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-between p-4 cursor-pointer select-none overflow-y-auto">
                <div className="text-center mt-2">
                  <h2 className="text-2xl font-black drop-shadow tracking-widest" style={{ color: suitTheme.primaryColor }}>SIEGEREHRUNG</h2>
                  <p className="text-xs text-sky-300 font-bold mt-0.5">Das große Turnier ist zu Ende</p>
                </div>

                <div className="my-auto flex flex-col items-center w-full">
                  <div className="relative flex flex-col items-center mb-3">
                    
                    <div className="relative z-20 flex flex-col items-center">
                      <div className="absolute -top-7 animate-bounce drop-shadow z-30">
                        {suitTheme.crownSvg}
                      </div>
                      
                      <div className="w-24 h-24 rounded-full border-4 p-1 flex items-center justify-center shadow-2xl bg-slate-900 relative overflow-visible mt-2" style={{ borderColor: suitTheme.primaryColor, boxShadow: `0 0 35px ${suitTheme.glowColor}` }}>
                        <div className="absolute top-0 inset-x-0 h-8 bg-gradient-to-b from-white/20 to-transparent rounded-t-full pointer-events-none z-10"></div>
                        <div className="w-full h-full rounded-full overflow-hidden flex items-center justify-center">
                          {renderAvatarIcon(winnerAvatar, "w-full h-full")}
                        </div>
                      </div>
                    </div>
                    
                    <div 
                      className={`w-48 h-20 mt-[-16px] flex flex-col items-center justify-center element-podium-active z-10 ${suitTheme.podiumClass} ${winnerSuitKey === 'yellow' ? 'animate-tornado' : ''}`}
                      style={{ '--glow-color': suitTheme.glowColor }}
                    >
                      <span className="text-xs font-black text-white uppercase tracking-wider drop-shadow mt-3">{winner.name}</span>
                      <span className="text-sm font-black text-amber-300 drop-shadow">{winner.score} Ptn</span>
                    </div>
                  </div>

                  <div className="w-full bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-2 text-xs">
                    <div className="font-bold text-sky-300 mb-1 border-b border-slate-800 pb-1 text-center">Finale Rangliste:</div>
                    {victoryData.map((p, idx) => (
                      <div key={p.id} className={`p-2 rounded-xl flex justify-between items-center ${idx === 0 ? 'bg-slate-950/80 border text-white' : 'bg-slate-950/60 text-slate-300'}`} style={{ borderColor: idx === 0 ? suitTheme.primaryColor : undefined }}>
                        <div className="flex items-center gap-2">
                          <span className="font-black text-xs text-sky-400 w-4">#{idx + 1}</span>
                          <div className="w-6 h-6 rounded-full overflow-hidden flex items-center justify-center">
                            {renderAvatarIcon(p.avatarObj || profile.selectedAvatar, "w-full h-full")}
                          </div>
                          <span className="font-bold truncate">{p.name}</span>
                        </div>
                        <span className="font-black text-amber-400">{p.score} Ptn</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="w-full flex flex-col items-center gap-1 mb-2">
                  <button onClick={finishGameAndGoMenu} className="w-full py-3.5 mythic-btn-primary text-white font-black text-sm rounded-2xl shadow-2xl active:scale-95 transition-transform">Zurück zum Hauptmenü</button>
                  <span className="text-[11px] text-sky-400 font-extrabold bg-sky-950 px-3 py-1 rounded-full border border-sky-500/30">Schließt in {victoryTimer}s</span>
                </div>
              </div>
            );
          })()}

          <div className="flex justify-between items-center mb-1 bg-slate-900/80 p-2 rounded-xl border border-slate-800">
            <span className="text-xs font-bold text-sky-400">Runde {round} / {maxRounds}</span>
            {phase === 'playing' && isHumanTurn && !isEvaluatingRef.current && !animatingCardId && !collectingWinnerId && !showDiceModal && !roundSummary && !victoryData && !showExitConfirm && (
              <span className="text-[11px] font-extrabold text-amber-400 bg-amber-950/80 px-2.5 py-0.5 rounded-full border border-amber-500/40 animate-pulse">Dein Zug: {turnTimer}s</span>
            )}
            <button onClick={() => setShowExitConfirm(true)} className="text-[10px] bg-slate-800 hover:bg-slate-700 active:scale-95 text-sky-300 border border-sky-500/30 px-2.5 py-1 rounded-lg font-bold transition-all shadow">Menü</button>
          </div>

          <div className="grid grid-cols-3 gap-1.5">
            {players.filter(p => !p.isHuman).map(p => {
              const isCurrentTurn = (turn === p.id);
              const isWinnerCollecting = (collectingWinnerId === p.id);
              return (
                <div key={p.id} className={`p-1.5 rounded-xl border flex items-center gap-2 text-xs transition-all ${isCurrentTurn ? 'border-sky-400 bg-slate-800 shadow-lg shadow-sky-500/20' : 'border-slate-800 bg-slate-900/60'} ${isWinnerCollecting ? 'ring-2 ring-amber-400 bg-amber-950/40 shadow-[0_0_15px_#f59e0b]' : ''}`}>
                  <div className="shrink-0 scale-75 origin-left">
                    {renderAvatarIcon(p.avatarObj, "w-10 h-10 text-base")}
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className={`font-bold truncate text-[11px] ${isCurrentTurn ? 'text-sky-300' : 'text-slate-300'}`}>{isCurrentTurn ? `> ${p.name}` : p.name}</div>
                    <div className="text-[10px] font-bold text-amber-400">{p.score} Ptn</div>
                    <div className="text-[9px] text-slate-300">Ansage: {p.bid !== null ? p.bid : '?'} | Stiche: {p.tricks}</div>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="flex-1 my-2 rounded-2xl border border-sky-500/40 p-2 flex flex-col justify-between items-center relative overflow-hidden shadow-2xl bg-slate-950">
            <div className="absolute inset-0 z-0 pointer-events-none">
              <img src="./1791660049147.jpg" alt="Spieltisch Hintergrund" className="w-full h-full object-cover" />
              <div className="absolute inset-0 bg-slate-950/50 backdrop-brightness-90"></div>
            </div>

            <div className="flex items-center gap-2 z-10">
              <span className="text-[10px] font-bold text-sky-300 uppercase drop-shadow">Trumpf:</span>
              {trumpCard ? <CardFace card={trumpCard} size="sm" disabled /> : <CardBack size="sm" />}
            </div>

            <div className="w-full flex-1 flex items-center justify-center p-2 relative z-10">
              <div className={`grid grid-cols-2 gap-4 items-center justify-items-center ${collectingWinnerId !== null ? (collectingWinnerId === 0 ? 'animate-fly-to-bottom' : 'animate-fly-to-top') : ''}`}>
                {playedCards.map((pc, i) => (
                  <div key={i} className="flex flex-col items-center">
                    <span className="text-[9px] text-sky-200 mb-0.5 drop-shadow">{players[pc.playerId]?.name}</span>
                    <CardFace card={pc.card} size="sm" disabled />
                  </div>
                ))}
              </div>

              {animatingCardId && animatingCardObj && (
                <div className="absolute inset-0 flex flex-col items-center justify-center z-40 bg-black/60 backdrop-blur-[2px]">
                  <div className="relative flex flex-col items-center">
                    {renderTcgElementAnimation(animatingCardObj)}
                    <CardFace card={animatingCardObj} size="md" disabled className="animate-tcglike-slam mt-2" />
                  </div>
                </div>
              )}
            </div>

            {phase === 'bidding' && !showDiceModal && !roundSummary && !victoryData && !showExitConfirm && (
              <div className="w-full bg-slate-900/95 border border-sky-500/50 p-3 rounded-2xl flex flex-col items-center gap-2 shadow-2xl backdrop-blur-md z-20">
                <div className="flex justify-between items-center w-full px-1">
                  <span className="text-xs font-bold text-sky-300">Deine Stich-Ansage für Runde {round}:</span>
                  <span className="text-[10px] font-extrabold text-amber-400 bg-amber-950 px-2 py-0.5 rounded-full border border-sky-500/30">Noch {biddingTimer}s</span>
                </div>
                <div className="flex gap-2 flex-wrap justify-center">
                  {Array.from({ length: round + 1 }, (_, i) => (
                    <button key={i} onClick={() => handleHumanBid(i)} className="w-10 h-10 rounded-full bg-gradient-to-b from-sky-500 to-sky-700 text-white font-black text-base shadow-lg border border-sky-300 active:scale-90 transition-transform">{i}</button>
                  ))}
                </div>
              </div>
            )}
          </div>

          <div className={`p-2 rounded-2xl border transition-all ${isHumanTurn && phase === 'playing' ? 'border-sky-400 bg-slate-800/90 shadow-xl shadow-sky-500/20 ring-1 ring-sky-400/50' : 'border-slate-800 bg-slate-900'} ${collectingWinnerId === 0 ? 'ring-2 ring-amber-400 bg-amber-950/40 shadow-[0_0_20px_#f59e0b]' : ''}`}>
            <div className="flex justify-between items-center mb-1 px-1">
              <div className="flex items-center gap-2">
                <div className="shrink-0 scale-75 origin-left">
                  {renderAvatarIcon(humanPlayer.avatarObj || profile.selectedAvatar, "w-8 h-8 text-sm")}
                </div>
                <span className={`text-xs font-bold ${isHumanTurn && phase === 'playing' ? 'text-sky-300 animate-pulse' : 'text-slate-300'}`}>
                  {isHumanTurn && phase === 'playing' ? 'DEINE HAND:' : 'DEINE HAND:'}
                </span>
                <span className="text-xs font-extrabold text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded-md border border-amber-500/30">{humanPlayer.score || 0} Ptn</span>
              </div>
              <span className="text-xs font-bold text-sky-400">Ansage: {humanPlayer.bid !== null ? humanPlayer.bid : '-'} | Stiche: {humanPlayer.tricks}</span>
            </div>

            <div className="flex gap-1.5 overflow-x-auto pb-1 justify-center">
              {humanPlayer.hand && humanPlayer.hand.map((card, i) => (
                <CardFace key={card.id || i} card={card} size="md" disabled={phase !== 'playing' || turn !== 0 || isEvaluatingRef.current || animatingCardId !== null || collectingWinnerId !== null || showExitConfirm} onClick={() => playCard(0, i)} />
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
