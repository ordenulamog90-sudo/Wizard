    body { 
      background-color: #030712; 
      color: white; 
      font-family: 'Cinzel', serif; 
      user-select: none;

    .card-art-box {
      background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.6) 100%);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .mythic-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 25px rgba(14, 165, 233, 0.2);
    }
    .mythic-btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 50%, #075985 100%);
      border: 1px solid #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }
    .mythic-btn-menu {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(30, 41, 59, 0.85) 100%);
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: inset 0 0 10px rgba(56, 189, 248, 0.1);
      backdrop-filter: blur(8px);
    }
    .crystal-btn {
      transition: all 0.2s ease-in-out;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .crystal-active {
      background: radial-gradient(circle at center, #0284c7 0%, #0369a1 100%);
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
      transform: scale(1.05);
    }

    @keyframes rollDiceAction {
      0% { transform: rotate(0deg) scale(0.6); }
      50% { transform: rotate(720deg) scale(1.3); }
      100% { transform: rotate(1080deg) scale(1); }
    }
    .animate-dice-active {
      animation: rollDiceAction 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;

    // --- GLOBAL SOUND & MUSIC ENGINE ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.bgMusic = null;
        this.isInitialized = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        if (!this.bgMusic) {
          this.bgMusic = new Audio('./mythosmainmenu.mp3');
          this.bgMusic.loop = true;
          this.bgMusic.volume = 0.5;
        }

        if (this.bgMusic && this.bgMusic.paused) {
          this.bgMusic.play().then(() => {
            this.isInitialized = true;
          }).catch(e => console.log("Autoplay waiting for interaction"));
        }
      }
      setMusicVolume(volume) {
        if (this.bgMusic) {
          this.bgMusic.volume = volume;
        }
      }
      togglePlay() {
        if (!this.bgMusic) {
          this.init();
          return true;
        }
        if (this.bgMusic.paused) {
          this.bgMusic.play();
          return true;
        } else {
          this.bgMusic.pause();
          return false;
        }
      }
      playCardSound(volume = 0.5) {
        if (volume <= 0) return;
        this.init();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.1);

        gain.gain.setValueAtTime(volume * 0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }
      playWizardSound(volume = 0.5) {
        if (volume <= 0) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.35);

        gain.gain.setValueAtTime(volume * 0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.35);
      }
      playDiceSound(volume = 0.5) {
        if (volume <= 0) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        for (let i = 0; i < 4; i++) {
          const delay = i * 0.08;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(150 + Math.random() * 100, now + delay);

          gain.gain.setValueAtTime(volume * 0.15, now + delay);
          gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.05);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + delay);
          osc.stop(now + delay + 0.05);
        }
        setTimeout(() => {
          if (!this.ctx) return;
          const t2 = this.ctx.currentTime;
          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(220, t2);
          osc2.frequency.exponentialRampToValueAtTime(110, t2 + 0.15);

          gain2.gain.setValueAtTime(volume * 0.3, t2);
          gain2.gain.exponentialRampToValueAtTime(0.01, t2 + 0.15);

          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(t2);
          osc2.stop(t2 + 0.15);
        }, 320);
      }
      playWinTrickSound(volume = 0.5) {
        if (volume <= 0) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, idx) => {
          const startTime = now + idx * 0.06;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(volume * 0.25, startTime);
          gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.2);
        });
      }
      playVictorySound(volume = 0.5) {
        if (volume <= 0) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const chord = [392.00, 523.25, 659.25, 783.99];
        chord.forEach((freq) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(volume * 0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 1.2);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 1.2);
        });
      }
    }

    const validatePlayerName = (input) => {
      const trimmed = input.trim();
      if (trimmed.length < 3) return { valid: false, error: 'Name muss mind. 3 Zeichen lang sein!' };
      if (trimmed.length > 16) return { valid: false, error: 'Name darf max. 16 Zeichen lang sein!' };
      
      const cleanRegex = /^[a-zA-Z0-9_äöüÄÖÜß\s]+$/;
      if (!cleanRegex.test(trimmed)) return { valid: false, error: 'Keine Sonderzeichen erlaubt!' };

      const lower = trimmed.toLowerCase().replace(/[\s_0-9]/g, '');
      const containsBanned = BANNED_WORDS.some(word => lower.includes(word));
      if (containsBanned) return { valid: false, error: 'Unangebrachter Name nicht erlaubt!' };

      return { valid: true, error: '' };
    };

      for (let i = shuffled.length - 1; i > 0; i--) {

        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];

          {isRedTwelve && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791699299500.jpg" alt="Card" className="w-full h-full object-cover" /></div>}
          {isRedThirteen && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791699330751.jpg" alt="Card" className="w-full h-full object-cover" /></div>}

          {isYellowOne && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791701576314.jpg" alt="Card" className="w-full h-full object-cover" /></div>}
          {isYellowTwo && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791701667083.jpg" alt="Card" className="w-full h-full object-cover" /></div>}
          {isYellowThree && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791701691014.jpg" alt="Card" className="w-full h-full object-cover" /></div>}
          {isYellowFour && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791701832104.jpg" alt="Card" className="w-full h-full object-cover" /></div>}
          {isYellowFive && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791701870106.jpg" alt="Card" className="w-full h-full object-cover" /></div>}
          {isYellowSix && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791702013917.jpg" alt="Card" className="w-full h-full object-cover" /></div>}
          {isYellowSeven && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791702218773.jpg" alt="Card" className="w-full h-full object-cover" /></div>}
          {isYellowEight && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791702263173.jpg" alt="Card" className="w-full h-full object-cover" /></div>}
          {isYellowNine && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791702444012.jpg" alt="Card" className="w-full h-full object-cover" /></div>}
          {isYellowTen && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791702517230.jpg" alt="Card" className="w-full h-full object-cover" /></div>}
          {isYellowEleven && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791705657196.jpg" alt="Card" className="w-full h-full object-cover" /></div>}
          {isYellowTwelve && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791705766319.jpg" alt="Card" className="w-full h-full object-cover" /></div>}
          {isYellowThirteen && <div className="absolute inset-0 z-0 overflow-hidden"><img src="./1791705774151.jpg" alt="Card" className="w-full h-full object-cover" /></div>}

          <div className={`w-full flex justify-end font-black text-xs drop-shadow z-10 px-1 ${cornerColorClass}`}>
            <span>{cornerText}</span>
          </div>
          <div className="flex-1 my-0.5 w-full flex items-center justify-center z-10"></div>
          <div className={`w-full flex justify-start font-black text-xs drop-shadow rotate-180 z-10 px-1 ${cornerColorClass}`}>
            <span>{cornerText}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [screen, setScreen] = useState('menu');
      const [showExitConfirm, setShowExitConfirm] = useState(false);
      const [showAvatarModal, setShowAvatarModal] = useState(false);
      const [isPlayingMusic, setIsPlayingMusic] = useState(true);
      const [soundVolume, setSoundVolume] = useState(0.5);

      const [profile, setProfile] = useState({
        name: 'Erzmagier',
        level: 1,
        xp: 0,
        activeSuit: 'yellow',
        selectedAvatar: { type: 'jester', suit: 'yellow' },
        elementLevels: { red: { level: 1, xp: 0 }, blue: { level: 1, xp: 0 }, green: { level: 1, xp: 0 }, yellow: { level: 1, xp: 0 } },
        offlinePlayed: 0,
        offlineWins: 0
      });

      const [playerCount, setPlayerCount] = useState(4);
      const [maxRounds, setMaxRounds] = useState(10);
      const [difficulty, setDifficulty] = useState('Normal');

      const [round, setRound] = useState(1);
      const [phase, setPhase] = useState('bidding');
      const [players, setPlayers] = useState([]);
      const [trumpCard, setTrumpCard] = useState(null);
      const [playedCards, setPlayedCards] = useState([]);
      const [turn, setTurn] = useState(0);

      const [showDiceModal, setShowDiceModal] = useState(false);
      const [isDiceRolling, setIsDiceRolling] = useState(false);
      const [diceRolls, setDiceRolls] = useState(null);
      const [diceWinner, setDiceWinner] = useState(null);
      const [roundSummary, setRoundSummary] = useState(null);
      const [victoryData, setVictoryData] = useState(null);

      const handleToggleMusic = () => {
        const playing = soundEngine.togglePlay();
        setIsPlayingMusic(playing);
      };

      const handleUserInteraction = () => {
        soundEngine.init();
      };

      const startNewGameSetup = () => {
        handleUserInteraction();
        setScreen('game_setup');
      };

      const launchGameExecution = () => {
        handleUserInteraction();
        const shuffledNames = shuffleArray(FAMOUS_WIZARDS);
        const suitKeys = Object.keys(SUITS);

        const initialPlayers = [
          { id: 0, name: profile.name, avatarObj: profile.selectedAvatar, isHuman: true, bid: null, tricks: 0, score: 0, hand: [] }
        ];

        for (let i = 1; i < playerCount; i++) {
          initialPlayers.push({
            id: i,
            name: `${shuffledNames[i - 1]} (KI)`,
            avatarObj: { type: 'jester', suit: suitKeys[i % suitKeys.length] },
            isHuman: false,
            bid: null,
            tricks: 0,
            score: 0,
            hand: []
          });
        }
        setPlayers(initialPlayers);
        setScreen('game');
        setShowExitConfirm(false);
        setShowDiceModal(true);
        setDiceRolls(null);
        setDiceWinner(null);
        setIsDiceRolling(false);
      };

      const handleUserRollDice = () => {
        if (isDiceRolling || diceRolls) return;
        setIsDiceRolling(true);
        soundEngine.playDiceSound(soundVolume);

        setTimeout(() => {
          const rolls = players.map(() => getCryptoRandomDice());
          let maxRoll = -1, winnerIdx = 0;
          rolls.forEach((val, idx) => { if (val > maxRoll) { maxRoll = val; winnerIdx = idx; } });
          setDiceRolls(rolls);
          setDiceWinner(winnerIdx);
          setIsDiceRolling(false);
        }, 800);
      };

      const startRoundAfterDice = () => {
        setShowDiceModal(false);
        startRound(1, players, diceWinner !== null ? diceWinner : 0);
      };

      const startRound = (rNum, currentPlayers, startingPlayerIdx) => {
        setRound(rNum);
        setPhase('bidding');
        setPlayedCards([]);
        setTurn(startingPlayerIdx);

        let rawDeck = [];
        const suits = ['yellow', 'red', 'green', 'blue'];
        suits.forEach(s => {
          for (let v = 1; v <= 13; v++) rawDeck.push({ type: 'number', value: v, suit: s, id: `${s}_${v}_${Math.random()}` });
        });
        for (let i = 0; i < 4; i++) rawDeck.push({ type: 'wizard', wizardIndex: i, id: `w_${i}_${Math.random()}` });
        for (let i = 0; i < 4; i++) rawDeck.push({ type: 'jester', suit: suits[i], id: `j_${i}_${Math.random()}` });

        let deck = shuffleArray(rawDeck);
        const newPlayers = currentPlayers.map(p => {
          const hand = deck.splice(0, rNum);
          return { ...p, hand, bid: null, tricks: 0 };
        });

        const trump = deck.length > 0 ? deck[0] : null;
        newPlayers.forEach(p => {
          if (!p.isHuman) p.bid = Math.min(Math.floor(Math.random() * (rNum + 1)), rNum);
        });

        setTrumpCard(trump);
        setPlayers(newPlayers);
      };

      const handleHumanBid = (bidVal) => {
        handleUserInteraction();
        setPlayers(prev => prev.map(p => p.isHuman ? { ...p, bid: bidVal } : p));
        setPhase('playing');
      };

      const playCard = (playerIdx, cardIdx) => {
        handleUserInteraction();
        const p = players[playerIdx];
        if (!p || !p.hand[cardIdx]) return;

        const selectedCard = p.hand[cardIdx];
        const newHand = p.hand.filter((_, i) => i !== cardIdx);

        setPlayers(prev => prev.map(pl => pl.id === p.id ? { ...pl, hand: newHand } : pl));
        setPlayedCards(prev => [...prev, { playerId: p.id, card: selectedCard }]);

        if (selectedCard.type === 'wizard') soundEngine.playWizardSound(soundVolume);
        else soundEngine.playCardSound(soundVolume);

        if (playedCards.length + 1 === players.length) {
          setTimeout(() => {
            soundEngine.playWinTrickSound(soundVolume);
            const winnerIdx = Math.floor(Math.random() * players.length);
            const winnerId = players[winnerIdx].id;

            setPlayers(prev => {
              const updated = prev.map(pl => pl.id === winnerId ? { ...pl, tricks: pl.tricks + 1 } : pl);
              setPlayedCards([]);

              if (updated[0].hand.length === 0) {
                setTimeout(() => handleRoundEnd(updated, round), 400);
              } else {
                setTurn(winnerId);
              }
              return updated;
            });
          }, 1000);
        } else {
          setTurn((playerIdx + 1) % players.length);
        }
      };

      const handleRoundEnd = (currentPlayers, currentRoundNum) => {
        const calculated = currentPlayers.map(p => {
          const diff = Math.abs(p.bid - p.tricks);
          let pointsGained = (diff === 0) ? (20 + (p.tricks * 10)) : -(diff * 10);
          return { ...p, score: p.score + pointsGained, pointsGained };
        });
        setRoundSummary({ round: currentRoundNum, calculatedPlayers: calculated });
      };

      const proceedToNextRound = () => {
        if (!roundSummary) return;
        const updated = roundSummary.calculatedPlayers;
        const nextR = roundSummary.round + 1;
        setRoundSummary(null);

        if (nextR <= maxRounds) {
          startRound(nextR, updated, 0);
        } else {
          const sortedFinal = [...updated].sort((a, b) => b.score - a.score);
          setVictoryData(sortedFinal);
        }
      };

      // --- HAUPTMENÜ ---
      if (screen === 'menu') {
        return (
          <div onClick={handleUserInteraction} className="relative w-full h-full bg-slate-950 flex items-center justify-center p-4 overflow-hidden">
            <button
              onClick={(e) => { e.stopPropagation(); handleToggleMusic(); }}
              className="absolute top-4 right-4 z-20 px-3 py-1.5 rounded-xl bg-slate-900/80 border border-sky-500/40 text-sky-300 text-xs font-bold backdrop-blur-md shadow-lg flex items-center gap-1.5"
            >
              <span>{isPlayingMusic ? '🎵 Musik AN' : '🔇 Musik AUS'}</span>
            </button>

            <div className="relative z-10 w-full max-w-sm flex flex-col gap-3 my-auto">
              <h1 className="text-3xl font-black text-center text-sky-300 mb-2 drop-shadow">MYTHOS</h1>
              <button
                onClick={startNewGameSetup}
                className="w-full py-4 rounded-2xl mythic-btn-primary text-white font-black text-lg shadow-2xl"
              >
                Spiel starten
              </button>
              <button
                onClick={() => setScreen('profile')}
                className="w-full py-3 rounded-2xl mythic-btn-menu text-sky-300 font-bold text-xs shadow-lg"
              >
                Profil & Stats
              </button>
              <button
                onClick={() => setScreen('rules')}
                className="w-full py-3 rounded-2xl mythic-btn-menu text-sky-300 font-bold text-xs shadow-lg"
              >
                Regeln
              </button>
            </div>
          </div>
        );
      }

      // --- SPIEL-SETUP ---
      if (screen === 'game_setup') {
        return (
          <div className="flex flex-col h-full max-w-md mx-auto p-4 justify-between bg-slate-950 overflow-y-auto">
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-black text-sky-300">Duell-Einstellungen</h2>
              <button onClick={() => setScreen('menu')} className="text-xs bg-slate-900 border border-slate-800 text-sky-300 px-3 py-1.5 rounded-lg font-bold">Zurück</button>
            </div>

            <div className="mythic-card p-4 rounded-2xl flex flex-col gap-4 my-auto">
              <div>
                <label className="text-xs font-bold text-sky-200 block mb-2">Spieleranzahl:</label>
                <div className="grid grid-cols-4 gap-2">
                  {[3, 4, 5, 6].map(num => (
                    <button
                      key={num}
                      onClick={() => setPlayerCount(num)}
                      className={`py-2.5 rounded-xl font-bold text-sm crystal-btn ${playerCount === num ? 'crystal-active text-white' : 'bg-slate-900 text-slate-400'}`}
                    >
                      {num}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="text-xs font-bold text-sky-200 block mb-2">Rundenanzahl:</label>
                <div className="grid grid-cols-3 gap-2">
                  {[5, 10, 15].map(num => (
                    <button
                      key={num}
                      onClick={() => setMaxRounds(num)}
                      className={`py-2.5 rounded-xl font-bold text-xs crystal-btn ${maxRounds === num ? 'crystal-active text-white' : 'bg-slate-900 text-slate-400'}`}
                    >
                      {num} Runden
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="text-xs font-bold text-sky-200 block mb-2">KI-Schwierigkeit:</label>
                <div className="grid grid-cols-3 gap-2">
                  {['Leicht', 'Normal', 'Magisch'].map(diff => (
                    <button
                      key={diff}
                      onClick={() => setDifficulty(diff)}
                      className={`py-2.5 rounded-xl font-bold text-xs crystal-btn ${difficulty === diff ? 'crystal-active text-white' : 'bg-slate-900 text-slate-400'}`}
                    >
                      {diff}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <button
              onClick={launchGameExecution}
              className="w-full py-4 rounded-2xl mythic-btn-primary text-white font-black text-base shadow-2xl mt-4"
            >
              Duell starten
            </button>
          </div>
        );
      }

      // --- REGELN ---
      if (screen === 'rules') {
        return (
          <div className="flex flex-col h-full max-w-md mx-auto p-4 justify-between bg-slate-950 overflow-y-auto">
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-bold text-sky-400">Spielregeln</h2>
              <button onClick={() => setScreen('menu')} className="text-xs bg-slate-800 text-sky-300 px-3 py-1.5 rounded-lg font-bold">Zurück</button>
            </div>
            <div className="space-y-3 text-xs text-slate-300 leading-relaxed my-auto">
              <p>Sagt vor jeder Runde exakt voraus, wie viele Stiche ihr gewinnen werdet. Zauberer schlagen alles, Narren verlieren immer.</p>
            </div>
            <button onClick={() => setScreen('menu')} className="w-full py-3 mythic-btn-primary text-white font-bold rounded-xl">Zurück zum Menü</button>
          </div>
        );
      }

      // --- PROFIL ---
      if (screen === 'profile') {
        return (
          <div className="flex flex-col h-full max-w-md mx-auto p-4 justify-between bg-slate-950 overflow-y-auto">
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-black text-sky-300">Profil</h2>
              <button onClick={() => setScreen('menu')} className="text-xs bg-slate-900 border border-slate-800 text-sky-300 px-3 py-1.5 rounded-lg font-bold">Zurück</button>
            </div>
            <div className="mythic-card p-4 rounded-2xl text-center space-y-2 my-auto">
              <h3 className="font-bold text-sky-200 text-sm">{profile.name}</h3>
              <p className="text-xs text-amber-400">Level {profile.level}</p>
            </div>
            <button onClick={() => setScreen('menu')} className="w-full py-3 mythic-btn-primary text-white font-bold rounded-xl">Zurück zum Menü</button>
          </div>
        );
      }

      // --- SPIELFELD ---
      const humanPlayer = players[0] || {};
      const isHumanTurn = (turn === 0);

      return (
        <div onClick={handleUserInteraction} className="flex flex-col h-full max-w-md mx-auto p-2 justify-between bg-slate-950 relative overflow-hidden">
          
          {showDiceModal && (
            <div onClick={handleUserRollDice} className="absolute inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 text-center cursor-pointer">
              <div className="w-full max-w-xs flex flex-col items-center gap-4">
                <h2 className="text-xl font-black text-sky-300">Duell-Eröffnung</h2>
                <div className="w-24 h-24 rounded-3xl bg-gradient-to-b from-sky-500 to-sky-800 border-2 border-sky-300 flex items-center justify-center text-3xl font-black shadow-2xl">
                  {isDiceRolling ? '...' : diceRolls ? diceRolls[0] : '?'}
                </div>
                {!diceRolls ? (
                  <span className="text-xs font-black text-amber-400 animate-pulse">Tippe zum Würfeln!</span>
                ) : (
                  <button onClick={startRoundAfterDice} className="w-full py-3 mythic-btn-primary text-white font-black text-xs rounded-xl">
                    Spiel starten ({players[diceWinner]?.name} beginnt)
                  </button>
                )}
              </div>
            </div>
          )}

          {roundSummary && (
            <div onClick={proceedToNextRound} className="absolute inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 cursor-pointer">
              <div className="w-full max-w-xs flex flex-col items-center gap-3">
                <h2 className="text-xl font-black text-sky-300">Ergebnis Runde {roundSummary.round}</h2>
                <div className="w-full space-y-2">
                  {roundSummary.calculatedPlayers.map(p => (
                    <div key={p.id} className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center text-xs">
                      <div>
                        <div className="font-bold text-sky-200">{p.name}</div>
                        <div className="text-[10px] text-slate-400">Stiche: {p.tricks} (Ansage: {p.bid})</div>
                      </div>
                      <div className="text-right">
                        <div className={`font-extrabold ${p.pointsGained >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                          {p.pointsGained >= 0 ? `+${p.pointsGained}` : p.pointsGained} Ptn
                        </div>
                        <div className="text-[10px] font-bold text-amber-300">Gesamt: {p.score}</div>
                      </div>
                    </div>
                  ))}
                  <button onClick={proceedToNextRound} className="w-full py-3 mythic-btn-primary text-white font-black text-xs rounded-xl mt-3">
                    Nächste Runde starten
                  </button>
                </div>
              </div>
            </div>
          )}

          {victoryData && (
            <div onClick={() => setScreen('menu')} className="absolute inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 cursor-pointer text-center">
              <h2 className="text-2xl font-black text-amber-400 mb-2">TURNIER-SIEGER</h2>
              <p className="text-base font-bold text-white mb-4">{victoryData[0]?.name} gewinnt mit {victoryData[0]?.score} Punkten!</p>
              <button onClick={() => setScreen('menu')} className="py-3 px-6 mythic-btn-primary text-white font-black text-xs rounded-xl">
                Zurück zum Menü
              </button>
            </div>
          )}

          <div className="flex justify-between items-center bg-slate-900 p-2 rounded-xl border border-slate-800 text-xs font-bold text-sky-300">
            <span>Runde {round} / {maxRounds}</span>
            <button onClick={() => setScreen('menu')} className="bg-slate-800 px-2 py-1 rounded-lg">Menü</button>
          </div>

          <div className="grid grid-cols-3 gap-1.5 my-1">
            {players.filter(p => !p.isHuman).map(p => (
              <div key={p.id} className="p-1.5 rounded-xl border border-slate-800 bg-slate-900 text-xs">
                <div className="font-bold text-sky-300 truncate text-[11px]">{p.name}</div>
                <div className="text-[10px] text-amber-400">{p.score} Ptn</div>
                <div className="text-[9px] text-slate-400">Ans: {p.bid ?? '?'} | St: {p.tricks}</div>
              </div>
            ))}
          </div>

          <div className="flex-1 my-2 rounded-2xl border border-sky-500/40 p-2 flex flex-col justify-between items-center relative bg-slate-950">
            <div className="flex items-center gap-2">
              <span className="text-[10px] text-sky-300">Trumpf:</span>
              {trumpCard ? <CardFace card={trumpCard} size="sm" disabled /> : <CardBack size="sm" />}
            </div>

            <div className="flex gap-3">
              {playedCards.map((pc, i) => (
                <div key={i} className="flex flex-col items-center">
                  <span className="text-[9px] text-sky-200">{players[pc.playerId]?.name}</span>
                  <CardFace card={pc.card} size="sm" disabled />
                </div>
              ))}
            </div>

            {phase === 'bidding' && !showDiceModal && (
              <div className="w-full bg-slate-900/95 p-3 rounded-2xl flex flex-col items-center gap-2 border border-sky-500/50">
                <span className="text-xs text-sky-300 font-bold">Deine Ansage für Runde {round}:</span>
                <div className="flex gap-2 flex-wrap justify-center">
                  {Array.from({ length: round + 1 }, (_, i) => (
                    <button key={i} onClick={() => handleHumanBid(i)} className="w-10 h-10 rounded-full bg-sky-600 text-white font-black text-base shadow">{i}</button>
                  ))}
                </div>
              </div>
            )}
          </div>

          <div className="p-2 rounded-2xl border border-slate-800 bg-slate-900">
            <div className="flex justify-between text-xs font-bold text-sky-300 mb-1">
              <span>{humanPlayer.name} (Stiche: {humanPlayer.tricks})</span>
              <span>Ansage: {humanPlayer.bid ?? '-'} | {humanPlayer.score || 0} Ptn</span>
            </div>
            <div className="flex gap-1.5 overflow-x-auto pb-1 justify-center">
              {humanPlayer.hand && humanPlayer.hand.map((card, i) => (
                <CardFace key={card.id || i} card={card} size="md" disabled={phase !== 'playing' || turn !== 0} onClick={() => playCard(0, i)} />
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
